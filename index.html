function PreOpeningManagerDashboard({tasks,onRefresh,loading,lastUpdated,currentUser}){
  const h=React.createElement;
  const [projects,setProjects]=useState([]);
  const [projectsLoading,setProjectsLoading]=useState(false);
  const [range,setRange]=useState('all');
  const [region,setRegion]=useState('all');
  const [project,setProject]=useState('all');
  const [tech,setTech]=useState('all');
  const [status,setStatus]=useState('all');
  const [expanded,setExpanded]=useState('');

  const loadProjects=useCallback(async()=>{
    if(!currentUser||!currentUser.token)return;
    setProjectsLoading(true);
    try{
      const result=await fetchPreOpeningStores(currentUser.token,'');
      if(result&&result.success){
        setProjects(Array.isArray(result.stores)?result.stores:[]);
      }
    }finally{
      setProjectsLoading(false);
    }
  },[currentUser&&currentUser.token]);

  useEffect(()=>{loadProjects();},[loadProjects]);

  const refreshAll=async()=>{
    await Promise.all([
      Promise.resolve(onRefresh&&onRefresh()),
      Promise.resolve(loadProjects())
    ]);
  };

  const sourceTasks=tasks.filter(t=>isPreOpeningLocation(t.locationType,t.storeCode));
  const allDates=[...new Set(sourceTasks.map(ticketDate).filter(Boolean))].sort(compareTicketDateLabels);
  const allowedDates=range==='7'?new Set(allDates.slice(-7)):range==='30'?new Set(allDates.slice(-30)):null;

  const projectMap={};
  projects.forEach(p=>{
    if(!p||!p.code)return;
    projectMap[String(p.code)]={
      code:String(p.code),
      name:p.name||('پروژه '+p.code),
      city:p.city||'',
      region:p.region||'',
      address:p.address||'',
      status:p.status||'فعال',
      finalCode:p.finalCode||'',
      createdAt:p.createdAt||'',
      tickets:[]
    };
  });

  sourceTasks.forEach(t=>{
    const code=String(t.storeCode||'');
    if(!code)return;
    if(!projectMap[code]){
      projectMap[code]={
        code,
        name:t.storeName||('پروژه '+code),
        city:t.projectCity||'',
        region:t.region||'',
        address:t.projectAddress||'',
        status:'فعال',
        finalCode:t.finalStoreCode||'',
        createdAt:'',
        tickets:[]
      };
    }
    projectMap[code].tickets.push(t);
    if(!projectMap[code].city&&t.projectCity)projectMap[code].city=t.projectCity;
    if(!projectMap[code].address&&t.projectAddress)projectMap[code].address=t.projectAddress;
    if(!projectMap[code].region&&t.region)projectMap[code].region=t.region;
    if(!projectMap[code].name&&t.storeName)projectMap[code].name=t.storeName;
  });

  const allProjects=Object.values(projectMap);
  const regions=[...new Set(allProjects.map(p=>p.region).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  const technicians=[...new Set(sourceTasks.map(t=>t.technician).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));

  const filteredTasks=sourceTasks.filter(t=>{
    const d=ticketDate(t);
    if(allowedDates&&!allowedDates.has(d))return false;
    if(region!=='all'&&t.region!==region)return false;
    if(project!=='all'&&String(t.storeCode)!==project)return false;
    if(tech!=='all'&&t.technician!==tech)return false;

    const review=t.reviewStatus||'pending';
    const work=t.workStatus||(t.type==='outsourced'?'open':'completed');

    if(status==='pending'&&review!=='pending')return false;
    if(status==='openOutsource'&&!(t.type==='outsourced'&&work!=='completed'&&review!=='cancelled'))return false;
    if(status==='completed'&&work!=='completed')return false;
    return true;
  });

  const filteredProjects=allProjects.filter(p=>{
    if(region!=='all'&&p.region!==region)return false;
    if(project!=='all'&&p.code!==project)return false;
    if(tech!=='all'&&!p.tickets.some(t=>t.technician===tech))return false;

    if(status==='pending'&&!p.tickets.some(t=>(t.reviewStatus||'pending')==='pending'))return false;
    if(status==='openOutsource'&&!p.tickets.some(t=>t.type==='outsourced'&&(t.workStatus||'open')!=='completed'&&t.reviewStatus!=='cancelled'))return false;
    if(status==='completed'&&p.tickets.length&&!p.tickets.every(t=>(t.workStatus||(t.type==='outsourced'?'open':'completed'))==='completed'))return false;
    return true;
  });

  const totalActions=filteredTasks.length;
  const projectCount=filteredProjects.length;
  const pendingReview=filteredTasks.filter(t=>(t.reviewStatus||'pending')==='pending').length;
  const openOutsource=filteredTasks.filter(t=>t.type==='outsourced'&&(t.workStatus||'open')!=='completed'&&t.reviewStatus!=='cancelled').length;
  const internal=filteredTasks.filter(t=>t.type==='internal').length;
  const outsourced=filteredTasks.filter(t=>t.type==='outsourced').length;
  const activeTech=new Set(filteredTasks.map(t=>t.technician).filter(Boolean)).size;
  const zeroActionProjects=filteredProjects.filter(p=>p.tickets.length===0).length;

  const projectRows=filteredProjects.map(p=>{
    const ticketList=filteredTasks.filter(t=>String(t.storeCode)===p.code);
    const pending=ticketList.filter(t=>(t.reviewStatus||'pending')==='pending').length;
    const open=ticketList.filter(t=>t.type==='outsourced'&&(t.workStatus||'open')!=='completed'&&t.reviewStatus!=='cancelled').length;
    const latest=[...ticketList].sort((a,b)=>
      String(b.createdAt||'').localeCompare(String(a.createdAt||''))||
      Number(b.rowNumber||0)-Number(a.rowNumber||0)
    )[0];

    let state='عادی';
    let cls='status-good';
    if(open>0||pending>=3){state='نیازمند پیگیری';cls='status-bad';}
    else if(pending>0){state='در انتظار بررسی';cls='status-warn';}
    else if(ticketList.length===0){state='بدون اقدام ثبت‌شده';cls='status-warn';}

    return{
      ...p,
      tickets:ticketList,
      total:ticketList.length,
      pending,
      open,
      internal:ticketList.filter(t=>t.type==='internal').length,
      outsourced:ticketList.filter(t=>t.type==='outsourced').length,
      latest,
      state,
      cls
    };
  }).sort((a,b)=>
    b.open-a.open||
    b.pending-a.pending||
    b.total-a.total||
    String(a.city||a.name).localeCompare(String(b.city||b.name),'fa')
  );

  const categoryRows=sortedEntries(countBy(filteredTasks.filter(t=>t.level1),t=>t.level1),8);
  const regionRows=sortedEntries(countBy(filteredTasks.filter(t=>t.region),t=>t.region),10);

  const categoryData={
    labels:categoryRows.map(x=>x[0]),
    datasets:[{
      label:'تعداد اقدام',
      data:categoryRows.map(x=>x[1]),
      backgroundColor:'#2f6f5e',
      borderRadius:7,
      borderSkipped:false
    }]
  };

  const regionData={
    labels:regionRows.map(x=>x[0]),
    datasets:[{
      label:'تعداد اقدام',
      data:regionRows.map(x=>x[1]),
      backgroundColor:'#b8721f',
      borderRadius:7,
      borderSkipped:false
    }]
  };

  const barOptions={
    responsive:true,
    maintainAspectRatio:false,
    indexAxis:'y',
    plugins:{legend:{display:false}},
    scales:{
      x:{beginAtZero:true,ticks:{precision:0},grid:{color:'rgba(0,0,0,.05)'}},
      y:{grid:{display:false},ticks:{font:{size:9}}}
    }
  };

  const head=h('div',{className:'dashboard-head preopening-manager-head'},
    h('div',{className:'dashboard-title'},
      h('div',{className:'preopening-manager-badge'},'PRE-OPENING'),
      h('h2',null,'داشبورد پروژه‌های پیش‌افتتاح'),
      h('p',null,'نمای جداگانه پروژه‌ها و اقدامات فنی قبل از افتتاح فروشگاه'),
      lastUpdated&&h('div',{className:'dashboard-meta'},'آخرین به‌روزرسانی تیکت‌ها: '+new Date(lastUpdated).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}))
    ),
    h('button',{className:'refresh-btn',onClick:refreshAll,disabled:loading||projectsLoading},
      (loading||projectsLoading)?'در حال تازه‌سازی...':'↻ تازه‌سازی پروژه‌ها و اقدامات'
    )
  );

  const filters=h('div',{className:'dashboard-filters preopening-manager-filters'},
    h('select',{value:range,onChange:e=>setRange(e.target.value)},
      h('option',{value:'all'},'کل بازه'),
      h('option',{value:'7'},'۷ روز ثبت‌شده اخیر'),
      h('option',{value:'30'},'۳۰ روز ثبت‌شده اخیر')
    ),
    h('select',{value:region,onChange:e=>{setRegion(e.target.value);setProject('all');}},
      h('option',{value:'all'},'همه مناطق'),
      ...regions.map(x=>h('option',{key:x,value:x},x))
    ),
    h('select',{value:project,onChange:e=>setProject(e.target.value)},
      h('option',{value:'all'},'همه پروژه‌ها'),
      ...allProjects
        .filter(p=>region==='all'||p.region===region)
        .sort((a,b)=>String(a.city||a.name).localeCompare(String(b.city||b.name),'fa'))
        .map(p=>h('option',{key:p.code,value:p.code},(p.city||p.name)+' — '+p.code))
    ),
    h('select',{value:tech,onChange:e=>setTech(e.target.value)},
      h('option',{value:'all'},'همه کارشناسان'),
      ...technicians.map(x=>h('option',{key:x,value:x},x))
    ),
    h('select',{value:status,onChange:e=>setStatus(e.target.value)},
      h('option',{value:'all'},'همه وضعیت‌ها'),
      h('option',{value:'pending'},'در انتظار بررسی'),
      h('option',{value:'openOutsource'},'برون‌سپاری باز'),
      h('option',{value:'completed'},'تکمیل‌شده')
    )
  );

  const kpis=h('div',{className:'kpi-grid preopening-kpi-grid'},
    h(Kpi,{label:'پروژه پیش‌افتتاح',value:projectCount,note:zeroActionProjects+' پروژه بدون اقدام ثبت‌شده',icon:'🏗️',tone:'amber'}),
    h(Kpi,{label:'کل اقدامات فنی',value:totalActions,note:internal+' داخلی · '+outsourced+' برون‌سپاری',icon:'🧰'}),
    h(Kpi,{label:'در انتظار بررسی',value:pendingReview,note:pendingReview?'نیازمند اقدام مدیر':'صف بررسی خالی است',icon:'🔎',tone:'amber'}),
    h(Kpi,{label:'برون‌سپاری باز',value:openOutsource,note:openOutsource?'در انتظار پایان کار':'مورد بازی وجود ندارد',icon:'↗️',tone:'red'}),
    h(Kpi,{label:'کارشناس فعال',value:activeTech,note:'دارای فعالیت پیش‌افتتاح',icon:'👷'}),
    h(Kpi,{label:'نرخ انجام داخلی',value:pct(internal,totalActions)+'٪',note:internal+' اقدام داخل سازمان',icon:'🛠️'})
  );

  const charts=h('div',{className:'dash-grid'},
    h('div',{className:'dash-card'},
      h('div',{className:'dash-card-head'},
        h('div',null,
          h('h3',null,'نوع اقدامات پیش‌افتتاح'),
          h('p',null,'پرتکرارترین فعالیت‌های فنی ثبت‌شده')
        )
      ),
      categoryRows.length
        ?h(ChartBox,{type:'bar',data:categoryData,options:barOptions})
        :h('div',{className:'dash-empty'},'هنوز اقدامی برای نمایش ثبت نشده است')
    ),
    h('div',{className:'dash-card'},
      h('div',{className:'dash-card-head'},
        h('div',null,
          h('h3',null,'توزیع اقدامات در مناطق'),
          h('p',null,'حجم فعالیت پیش‌افتتاح هر منطقه')
        )
      ),
      regionRows.length
        ?h(ChartBox,{type:'bar',data:regionData,options:barOptions})
        :h('div',{className:'dash-empty'},'اطلاعات منطقه‌ای برای نمایش وجود ندارد')
    )
  );

  const rows=[];
  projectRows.forEach(p=>{
    const isOpen=expanded===p.code;
    rows.push(
      h('tr',{
        key:'project-'+p.code,
        className:'preopening-project-row'+(isOpen?' expanded':''),
        onClick:()=>setExpanded(isOpen?'':p.code)
      },
        h('td',null,
          h('span',{className:'store-expand-icon'},'⌄'),
          h('div',{className:'preopening-project-name'},
            h('b',null,p.city||p.name),
            h('span',null,p.name)
          )
        ),
        h('td',null,h('span',{className:'preopening-code'},p.code)),
        h('td',null,p.region||'—'),
        h('td',null,p.total),
        h('td',null,p.pending),
        h('td',null,p.open),
        h('td',null,p.latest?(p.latest.dateText||ticketDate(p.latest)||'—'):'—'),
        h('td',null,h('span',{className:'status-pill '+p.cls},p.state))
      )
    );

    if(isOpen){
      rows.push(
        h('tr',{key:'detail-'+p.code,className:'store-detail-row'},
          h('td',{colSpan:9},
            h('div',{className:'preopening-project-panel'},
              h('div',{className:'preopening-project-meta'},
                h('div',null,h('span',null,'نام پروژه'),h('b',null,p.name||'—')),
                h('div',null,h('span',null,'شهر'),h('b',null,p.city||'—')),
                h('div',null,h('span',null,'منطقه'),h('b',null,p.region||'—')),
                h('div',null,h('span',null,'آدرس'),h('b',null,p.address||'ثبت نشده'))
              ),
              p.tickets.length
                ?h('div',{className:'preopening-action-list'},

                      ),

                        h('span',null,t.ticketNumber||'—'),
                        h('span',null,t.technician||'—'),

function ManagerView({ tasks, updateTask, showToast, refreshTasks, managerLoading, lastUpdated, currentUser, technicianDirectory, activeStoreDirectory }){
  const [tab, setTab] = useState('report');
  const [storeFilter, setStoreFilter] = useState('');
  const preOpeningTasks=tasks.filter(t=>isPreOpeningLocation(t.locationType,t.storeCode));
  const preOpeningProjects=new Set(preOpeningTasks.map(t=>String(t.storeCode||'')).filter(Boolean)).size;

  const persistReviewStatus=async(id,status,note)=>{
    const ticket=tasks.find(t=>t.id===id);
    if(!ticket){
      showToast('تیکت پیدا نشد؛ صفحه را تازه‌سازی کنید');
      return false;
    }

    try{
      const result=await sendManagerReview(ticket,currentUser.token,status,note);

      if(result&&result.sessionExpired){
        showToast(result.message||'نشست مدیر منقضی شده است');
        return false;
      }

      if(!(result&&result.success)){

function normalizeFaDigits(v){
  return String(v||'')
    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}
function normalizeTicketDateLabel(value){
  const clean=normalizeFaDigits(value)
    .replace(/[\u200c\u200e\u200f\u202a-\u202e]/g,'')
    .replace(/[.\-]/g,'/')
    .replace(/\s+/g,'')
    .replace(/\/+/g,'/')
    .trim();
  const parts=clean.match(/\d+/g);
  if(!parts||parts.length<3)return clean;
  return [Number(parts[0]),Number(parts[1]),Number(parts[2])].join('/');
}
function ticketDate(t){
  return normalizeTicketDateLabel(t.dateText || (t.createdAt?dateKey(t.createdAt):''));
}
function ticketDateSortValue(value){
  const parts=normalizeTicketDateLabel(value).match(/\d+/g);
  if(!parts||parts.length<3)return Number.MAX_SAFE_INTEGER;
  const year=Number(parts[0])||0;
  const month=Number(parts[1])||0;
  const day=Number(parts[2])||0;
  return year*10000+month*100+day;
}
function compareTicketDateLabels(a,b){
  const diff=ticketDateSortValue(a)-ticketDateSortValue(b);
  if(Number.isFinite(diff)&&diff!==0)return diff;
  return String(a||'').localeCompare(String(b||''),'fa',{numeric:true});
}
function reviewLabel(v){return v==='reviewed'?'بررسی‌شده':v==='rejected'?'ردشده':v==='cancelled'?'لغوشده':'در انتظار';}
function pct(n,d){return d?Math.round(n/d*100):0;}
function countBy(list,keyFn){const out={};list.forEach(x=>{const k=keyFn(x);if(k)out[k]=(out[k]||0)+1;});return out;}
function sortedEntries(obj,limit){return Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,limit||999);}

function ChartBox({type,data,options,small}){
  const canvasRef=useRef(null); const chartRef=useRef(null);
  useEffect(()=>{
    if(!window.Chart||!canvasRef.current)return;
    if(chartRef.current)chartRef.current.destroy();
    window.Chart.defaults.font.family='Vazirmatn';
    window.Chart.defaults.color='#5b645f';
    chartRef.current=new window.Chart(canvasRef.current,{type,data,options});
    return()=>{if(chartRef.current)chartRef.current.destroy();};
  },[type,JSON.stringify(data),JSON.stringify(options)]);
  return React.createElement('div',{className:'chart-wrap'+(small?' small':'')},React.createElement('canvas',{ref:canvasRef}));
}

function Kpi({label,value,note,icon,tone}){

  );
}

function ExecutiveDashboard({tasks,onRefresh,loading,lastUpdated,currentUser,onLogout}){
  const h=React.createElement;
  const [range,setRange]=useState('30');
  const [region,setRegion]=useState('all');
  const [store,setStore]=useState('all');
  const [tech,setTech]=useState('all');
  const [category,setCategory]=useState('all');
  const [type,setType]=useState('all');
  const [selectedStore,setSelectedStore]=useState('');

  const allDates=[...new Set(tasks.map(ticketDate).filter(Boolean))].sort(compareTicketDateLabels);
  const today=normalizeTicketDateLabel(new Date().toLocaleDateString('fa-IR'));
  const rangeCount=range==='today'?1:(range==='all'?0:Number(range||30));
  const allowedDates=range==='all'?null:range==='today'?new Set([today]):new Set(allDates.slice(-rangeCount));
  const priorDates=range==='all'?null:new Set(range==='today'?allDates.slice(-2,-1):allDates.slice(-(rangeCount*2),-rangeCount));
  const regions=[...new Set(tasks.map(t=>t.region).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  const technicians=[...new Set(tasks.map(t=>t.technician).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  const categories=[...new Set(tasks.map(t=>t.level1).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  const storeLookup={};
  tasks.forEach(t=>{const code=String(t.storeCode||'');if(code&&!storeLookup[code])storeLookup[code]={code,name:t.storeName||('فروشگاه '+code),region:t.region||''};});
  const stores=Object.values(storeLookup).sort((a,b)=>a.code.localeCompare(b.code,'fa',{numeric:true}));

  const passDimensions=(t,includeDate=true,dateSet=allowedDates)=>{
    if(includeDate&&dateSet&&!dateSet.has(ticketDate(t)))return false;
    if(region!=='all'&&t.region!==region)return false;
    if(store!=='all'&&String(t.storeCode)!==store)return false;
    if(tech!=='all'&&t.technician!==tech)return false;
    if(category!=='all'&&t.level1!==category)return false;
    if(type!=='all'&&t.type!==type)return false;
    return true;
  };
  const relevant=tasks.filter(t=>passDimensions(t,true,allowedDates));
  const prior=priorDates?tasks.filter(t=>passDimensions(t,true,priorDates)):[];

  const now=Date.now();
  const validTime=v=>{const x=new Date(v).getTime();return Number.isFinite(x)?x:null;};
  const ageDays=t=>{const s=validTime(t.createdAt);return s===null?0:Math.max(0,(now-s)/86400000);};
  const resolutionHours=t=>{const s=validTime(t.createdAt),e=validTime(t.completedAt);return s!==null&&e!==null?Math.max(0,(e-s)/3600000):null;};
  const isCancelled=t=>(t.reviewStatus||'')==='cancelled'||t.workStatus==='cancelled';
  const isOutsourceOpen=t=>!isCancelled(t)&&t.type==='outsourced'&&t.workStatus!=='completed';
  const isPending=t=>!isCancelled(t)&&(t.reviewStatus||'pending')==='pending';
  const needsAction=t=>isOutsourceOpen(t)||isPending(t);
  const isCompleted=t=>!isCancelled(t)&&(t.type==='internal'||t.workStatus==='completed');
  const pctSafe=(n,d)=>d?Math.round(n/d*100):0;
  const avg=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
  const median=arr=>{if(!arr.length)return 0;const x=[...arr].sort((a,b)=>a-b),m=Math.floor(x.length/2);return x.length%2?x[m]:(x[m-1]+x[m])/2;};
  const fmtHours=v=>v>=48?(Math.round(v/24*10)/10)+' روز':Math.round(v)+' ساعت';
  const fmtDelta=(cur,prev)=>{if(!prev)return null;const d=Math.round((cur-prev)/prev*100);return (d>0?'+':'')+d+'٪ نسبت به دوره قبل';};
  const ticketIssueKey=t=>[String(t.storeCode||''),String(t.level1||''),Array.isArray(t.level2)&&t.level2.length?String(t.level2[0]):''].join('|');

  const total=relevant.length;
  const internal=relevant.filter(t=>t.type==='internal').length;
  const outsourced=relevant.filter(t=>t.type==='outsourced').length;
  const actionTickets=relevant.filter(needsAction);
  const actionCount=actionTickets.length;
  const outsourceOpen=relevant.filter(isOutsourceOpen).length;
  const pending=relevant.filter(isPending).length;
  const internalRate=pctSafe(internal,total);
  const completedOutsource=relevant.filter(t=>t.type==='outsourced'&&t.workStatus==='completed'&&!isCancelled(t));
  const outsourceTimes=completedOutsource.map(resolutionHours).filter(v=>v!==null&&Number.isFinite(v));
  const avgOutsourceHours=avg(outsourceTimes);
  const oldestAction=Math.round(Math.max(0,...actionTickets.map(ageDays)));
  const ageBands={d2:0,d7:0,d30:0,d30p:0};
  actionTickets.forEach(t=>{const d=ageDays(t);if(d<2)ageBands.d2++;else if(d<7)ageBands.d7++;else if(d<30)ageBands.d30++;else ageBands.d30p++;});

  const repeatMap={};
  relevant.filter(t=>!isCancelled(t)&&t.storeCode&&t.level1).forEach(t=>{const k=ticketIssueKey(t);if(!repeatMap[k])repeatMap[k]=[];repeatMap[k].push(t);});
  const repeatGroups=Object.values(repeatMap).filter(list=>list.length>=2);
  const repeatedTicketCount=repeatGroups.reduce((n,list)=>n+list.length,0);
  const repeatRate=pctSafe(repeatedTicketCount,total);

  const priorTotal=prior.length;
  const volumeDelta=fmtDelta(total,priorTotal);
  const activeStoreCount=new Set(relevant.map(t=>String(t.storeCode||'')).filter(Boolean)).size;
  const activeRegionCount=new Set(relevant.map(t=>t.region).filter(Boolean)).size;

  const groupBy=(list,keyFn)=>{const m={};list.forEach(x=>{const k=keyFn(x)||'نامشخص';if(!m[k])m[k]=[];m[k].push(x);});return m;};

  const regionMap=groupBy(relevant,t=>t.region||'منطقه نامشخص');
  const regionRows=Object.entries(regionMap).map(([name,list])=>{
    const actions=list.filter(needsAction);
    const openAges=actions.map(ageDays);
    const int=list.filter(t=>t.type==='internal').length;
    const out=list.filter(t=>t.type==='outsourced').length;
    const oldest=Math.round(Math.max(0,...openAges));
    const avgAge=avg(openAges);
    const internalPct=pctSafe(int,list.length);
    let classification='متوازن',classColor='#67e2d7',classSoft='rgba(103,226,215,.12)';
    if(internalPct<55&&avgAge>5){classification='نیازمند مداخله';classColor='#ff7b6b';classSoft='rgba(255,123,107,.13)';}
    else if(internalPct<55){classification='سریع اما وابسته';classColor='#f0c75e';classSoft='rgba(240,199,94,.13)';}
    else if(avgAge>5){classification='کمبود ظرفیت';classColor='#86a8ff';classSoft='rgba(134,168,255,.13)';}
    return {name,list,total:list.length,actions:actions.length,internalPct,outsourcePct:pctSafe(out,list.length),avgAge,oldest,stores:new Set(list.map(t=>String(t.storeCode||'')).filter(Boolean)).size,classification,classColor,classSoft};
  }).sort((a,b)=>b.actions-a.actions||b.avgAge-a.avgAge||b.total-a.total);

  const storeMap=groupBy(relevant,t=>String(t.storeCode||'نامشخص'));
  const storeRows=Object.entries(storeMap).map(([code,list])=>{
    const actions=list.filter(needsAction);
    const out=list.filter(t=>t.type==='outsourced').length;
    const localRepeat={};
    list.filter(t=>t.level1&&!isCancelled(t)).forEach(t=>{const k=[t.level1,Array.isArray(t.level2)&&t.level2.length?t.level2[0]:''].join('|');if(!localRepeat[k])localRepeat[k]=[];localRepeat[k].push(t);});
    const repeatLists=Object.values(localRepeat).filter(x=>x.length>=2).sort((a,b)=>b.length-a.length);
    const maxRepeat=repeatLists.length?repeatLists[0].length:0;
    const repeatLabel=repeatLists.length?[repeatLists[0][0].level1,Array.isArray(repeatLists[0][0].level2)&&repeatLists[0][0].level2.length?repeatLists[0][0].level2[0]:''].filter(Boolean).join(' / '):'';
    const oldest=Math.round(Math.max(0,...actions.map(ageDays)));
    const reasons=[];
    if(oldest>=7)reasons.push('قدیمی‌ترین پرونده '+oldest+' روز');
    if(maxRepeat>=2)reasons.push('تکرار احتمالی '+repeatLabel+' ×'+maxRepeat);
    if(list.length>=3&&pctSafe(out,list.length)>=60)reasons.push('وابستگی '+pctSafe(out,list.length)+'٪ به پیمانکار');
    if(actions.length>=3)reasons.push(actions.length+' پرونده نیازمند اقدام');
    if(!reasons.length)reasons.push('ریسک معناداری دیده نشد');
    const priority=(oldest>=14?4:oldest>=7?3:0)+(maxRepeat>=3?3:maxRepeat>=2?2:0)+(pctSafe(out,list.length)>=70?2:0)+(actions.length>=3?2:0);
    const first=list[0]||{};
    return {code,name:first.storeName||('فروشگاه '+code),region:first.region||'',list,total:list.length,actions:actions.length,oldest,outsourcePct:pctSafe(out,list.length),maxRepeat,repeatLabel,reasons,priority};
  }).sort((a,b)=>b.priority-a.priority||b.actions-a.actions||b.total-a.total);
  const riskStores=storeRows.filter(x=>x.priority>0);

  const rootBucket=t=>{
    const c=String(t.finalCause||t.initialCause||'').trim();
    if(!c)return 'فاقد تشخیص نهایی';
    if(/سرویس|نگهداری|گرفتگی|آلودگی|تنظیم/.test(c))return 'نگهداری و سرویس';
    if(/استفاده نادرست|آسیب فیزیکی/.test(c))return 'بهره‌برداری و آموزش';
    if(/نوسان برق/.test(c))return 'زیرساخت و برق';
    if(/استهلاک|خرابی قطعه/.test(c))return 'تجهیز و قطعه';
    return 'سایر و نامشخص';
  };
  const rootDefs={
    'تجهیز و قطعه':{color:'#86a8ff',action:'بازنگری کیفیت خرید، عمر تجهیز و سیاست تعویض'},
    'نگهداری و سرویس':{color:'#d7ff63',action:'تقویت PM، چک‌لیست سرویس و کنترل اجرای دوره‌ای'},
    'بهره‌برداری و آموزش':{color:'#f0c75e',action:'آموزش پرسنل فروشگاه و کنترل شیوه استفاده'},
    'زیرساخت و برق':{color:'#67e2d7',action:'بررسی برق، حفاظت، محیط و زیرساخت محل'},
    'فاقد تشخیص نهایی':{color:'#ff7b6b',action:'الزام ثبت علت نهایی برای تصمیم‌گیری معتبر'},
    'سایر و نامشخص':{color:'#9ca5ad',action:'بازبینی طبقه‌بندی علل و تکمیل توضیحات'}
  };
  const rootMap={};
  relevant.filter(t=>!isCancelled(t)).forEach(t=>{const k=rootBucket(t);rootMap[k]=(rootMap[k]||0)+1;});
  const rootRows=Object.keys(rootDefs).map(name=>({name,count:rootMap[name]||0,...rootDefs[name]})).filter(x=>x.count>0).sort((a,b)=>b.count-a.count);

  const reasonAction=r=>{
    if(/توانائی|توانایی/.test(r))return 'برنامه آموزش و توسعه مهارت';
    if(/ابزار/.test(r))return 'تأمین و استانداردسازی ابزار مناطق';
    if(/نقدینگی|تنخواه/.test(r))return 'اصلاح تنخواه و اختیار خرید محلی';
    if(/قطعه|موجودی|سفارش/.test(r))return 'موجودی حداقل و لجستیک قطعات';
    if(/زمان کافی|حجم تعمیرات/.test(r))return 'بازتنظیم ظرفیت و توزیع کار';
    if(/فاصله/.test(r))return 'بازطراحی پوشش جغرافیایی';
    return 'بررسی موردی و اصلاح فرآیند';
  };
  const outsourceReasonMap={};
  relevant.filter(t=>t.type==='outsourced'&&t.outsourceReason).forEach(t=>{
    const k=t.outsourceReason;if(!outsourceReasonMap[k])outsourceReasonMap[k]={count:0,regions:new Set()};outsourceReasonMap[k].count++;if(t.region)outsourceReasonMap[k].regions.add(t.region);
  });
  const outsourceReasonRows=Object.entries(outsourceReasonMap).map(([reason,v])=>({reason,count:v.count,share:pctSafe(v.count,outsourced),regions:[...v.regions],action:reasonAction(reason)})).sort((a,b)=>b.count-a.count);
  const shortageCount=relevant.filter(t=>t.type==='outsourced'&&/قطعه|موجودی|نقدینگی|تنخواه|سفارش/.test(String(t.outsourceReason||''))).length;

  const partMap={};
  relevant.forEach(t=>{
    [...(t.consumedParts||[]),...(t.completionParts||[])].forEach(p=>{
      const n=String(p&&p.name||'').trim();if(!n)return;if(!partMap[n])partMap[n]={qty:0,regions:new Set()};partMap[n].qty+=Number(p.qty)||1;if(t.region)partMap[n].regions.add(t.region);
    });
  });
  const partRows=Object.entries(partMap).map(([name,v])=>({name,qty:v.qty,regions:[...v.regions]})).sort((a,b)=>b.qty-a.qty).slice(0,10);
  const maxPart=Math.max(1,...partRows.map(x=>x.qty));

  const techMap=groupBy(relevant,t=>t.technician||'نامشخص');
  const workloads=Object.values(techMap).map(x=>x.length);
  const medianLoad=median(workloads)||1;
  const techRows=Object.entries(techMap).map(([name,list])=>{
    const actions=list.filter(needsAction).length;
    const int=list.filter(t=>t.type==='internal').length;
    const out=list.filter(t=>t.type==='outsourced').length;
    const intPct=pctSafe(int,list.length),outPct=pctSafe(out,list.length);
    let status='متوازن',color='#67e2d7',soft='rgba(103,226,215,.12)';
    if(list.length>=medianLoad*1.45&&actions>=2){status='بار کاری بالا';color='#ff7b6b';soft='rgba(255,123,107,.13)';}
    else if(list.length>=3&&outPct>=60){status='نیاز مهارتی/ابزار';color='#f0c75e';soft='rgba(240,199,94,.13)';}
    else if(actions>=3){status='انباشت پرونده';color='#86a8ff';soft='rgba(134,168,255,.13)';}
    return {name,total:list.length,actions,intPct,outPct,stores:new Set(list.map(t=>String(t.storeCode||'')).filter(Boolean)).size,status,color,soft};
  }).sort((a,b)=>b.actions-a.actions||b.total-a.total);

  const highOutRegion=[...regionRows].filter(r=>r.total>=3).sort((a,b)=>b.outsourcePct-a.outsourcePct)[0];
  const topActionRegion=regionRows.find(r=>r.actions>0);
  const topRepeatStore=[...storeRows].sort((a,b)=>b.maxRepeat-a.maxRepeat)[0];
  const maintenanceCount=(rootMap['نگهداری و سرویس']||0);
  const causeMissing=(rootMap['فاقد تشخیص نهایی']||0);
  const agenda=[];
  if(topActionRegion&&topActionRegion.actions){agenda.push({p:'P1',color:'#ff7b6b',soft:'rgba(255,123,107,.13)',title:'انباشت اقدام در '+topActionRegion.name,evidence:topActionRegion.actions+' پرونده نیازمند اقدام؛ قدیمی‌ترین '+topActionRegion.oldest+' روز.',action:'جلسه تعیین تکلیف با مدیر فنی منطقه و برنامه زمان‌بندی بستن معوقات.'});}
  if(highOutRegion&&highOutRegion.outsourcePct>=50){agenda.push({p:'P1',color:'#f0c75e',soft:'rgba(240,199,94,.13)',title:'وابستگی بالا به پیمانکار در '+highOutRegion.name,evidence:highOutRegion.outsourcePct+'٪ از '+highOutRegion.total+' تیکت برون‌سپاری شده است.',action:'تفکیک علت به مهارت، ابزار، قطعه و ظرفیت؛ سپس اقدام ساختاری متناسب.'});}
  if(topRepeatStore&&topRepeatStore.maxRepeat>=2){agenda.push({p:'P2',color:'#86a8ff',soft:'rgba(134,168,255,.13)',title:'تکرار احتمالی خرابی در '+topRepeatStore.name,evidence:topRepeatStore.repeatLabel+' حداقل '+topRepeatStore.maxRepeat+' بار در دوره ثبت شده است.',action:'بازبینی کیفیت تعمیر قبلی و تصمیم تعمیر اساسی یا تعویض تجهیز.'});}
  if(shortageCount){agenda.push({p:'P2',color:'#67e2d7',soft:'rgba(103,226,215,.13)',title:'اثر مستقیم قطعه و نقدینگی بر برون‌سپاری',evidence:shortageCount+' برون‌سپاری با علت مرتبط با قطعه، موجودی، سفارش یا تنخواه ثبت شده است.',action:'تعریف موجودی حداقل منطقه‌ای و اختیار خرید فوری برای اقلام بحرانی.'});}
  if(maintenanceCount){agenda.push({p:'P3',color:'#d7ff63',soft:'rgba(215,255,99,.12)',title:'فرصت کاهش خرابی با نگهداری پیشگیرانه',evidence:maintenanceCount+' مورد در سبد نگهداری، سرویس، گرفتگی یا تنظیم قرار دارد.',action:'تبدیل موارد پرتکرار به برنامه PM و کنترل اجرای چک‌لیست فروشگاه.'});}
  if(causeMissing){agenda.push({p:'P3',color:'#9ca5ad',soft:'rgba(156,165,173,.12)',title:'ضعف داده در ثبت علت نهایی',evidence:causeMissing+' تیکت فاقد تشخیص نهایی قابل استفاده برای تصمیم‌گیری است.',action:'الزام تکمیل علت نهایی پیش از بسته‌شدن پرونده.'});}
  if(!agenda.length)agenda.push({p:'OK',color:'#67e2d7',soft:'rgba(103,226,215,.12)',title:'موضوع بحرانی برجسته‌ای دیده نشد',evidence:'در فیلتر انتخاب‌شده معوق یا الگوی تکرار معناداری مشاهده نشد.',action:'پایش روند و تمرکز بر پیشگیری و کیفیت داده ادامه یابد.'});

  const topRoot=rootRows[0];
  const summaryParts=[];
  summaryParts.push('در بازه انتخاب‌شده '+total+' تیکت در '+activeStoreCount+' فروشگاه ثبت شده است.');
  if(actionCount)summaryParts.push(actionCount+' پرونده هنوز نیازمند اقدام اجرایی یا بررسی مدیریتی است و قدیمی‌ترین مورد '+oldestAction+' روز عمر دارد.');
  else summaryParts.push('پرونده نیازمند اقدام ثبت نشده است.');
  summaryParts.push('توان رفع داخلی '+internalRate+'٪ و سهم برون‌سپاری '+pctSafe(outsourced,total)+'٪ است.');
  if(repeatGroups.length)summaryParts.push(repeatGroups.length+' الگوی تکرار احتمالی خرابی شناسایی شده است.');
  if(topRoot)summaryParts.push('بزرگ‌ترین منشأ مسئله «'+topRoot.name+'» با '+topRoot.count+' مورد است.');
  if(volumeDelta)summaryParts.push('حجم ثبت '+volumeDelta+' بوده است.');
  const executiveSummary=summaryParts.join(' ');

    h('section',{className:'x-section',id:'x-regions'},h(XSectionHead,{no:'03',title:'الگوی عملکرد مناطق',sub:'تشخیص تفاوت میان کمبود ظرفیت و وابستگی به پیمانکار؛ بدون امتیاز مبهم'}),h('div',{className:'x-grid'},matrix,regionList),h('div',{style:{marginTop:'14px'}},trendPanel)),
    h('section',{className:'x-section',id:'x-causes'},h(XSectionHead,{no:'04',title:'منشأ مدیریتی مسائل',sub:'تفکیک مسئله تجهیز، نگهداری، بهره‌برداری، زیرساخت و کیفیت داده'}),roots,h('div',{style:{marginTop:'14px'}},outsourceTable)),
    h('section',{className:'x-section',id:'x-stores'},h(XSectionHead,{no:'05',title:'فروشگاه‌های پرریسک',sub:'اولویت با معوق، تکرار و وابستگی است؛ نه صرفاً تعداد تیکت'}),riskTable,drawer),
    h('section',{className:'x-section',id:'x-resources'},h(XSectionHead,{no:'06',title:'منابع، قطعات و ظرفیت',sub:'خروجی مستقیم برای تصمیم درباره نیروی انسانی، ابزار، خرید و موجودی'}),h('div',{className:'x-grid equal'},partsPanel,techPanel)),
    h('div',{className:'x-footnote'},'مبنای محاسبه: داده‌های موجود در شیت Tickets. «تکرار احتمالی» با ترکیب فروشگاه + گروه خرابی + اولین زیرگروه محاسبه شده و تا زمان افزودن شناسه تجهیز، معادل خرابی قطعی همان تجهیز نیست. زمان رفع داخلی نیز به دلیل ثبت هم‌زمان شروع و پایان قابل محاسبه دقیق نیست؛ بنابراین گزارش زمان فقط برون‌سپاری‌های دارای زمان پایان معتبر را استفاده می‌کند.')
  );

  if(!total){
    return h('div',{className:'x-shell'},filterPanel,h('main',{className:'x-main'},h('div',{className:'x-topline'},h('div',{className:'x-breadcrumb'},'سامانه تیکتینگ / ',h('b',null,'گزارش مدیریت ارشد')),h('button',{className:'x-refresh',onClick:onRefresh,disabled:loading},loading?'در حال دریافت...':'↻ تازه‌سازی داده')),hero,h('div',{className:'x-panel'},h('div',{className:'x-empty'},loading?'در حال دریافت داده‌ها...':'برای فیلتر انتخاب‌شده داده‌ای وجود ندارد'))));
  }
  return h('div',{className:'x-shell'},filterPanel,content);
}

/* ---------- Boardroom CEO Dashboard — نسخه 11.5 ---------- */
function CEODashboard({tasks,onRefresh,loading,lastUpdated,currentUser,onLogout}){
  const h=React.createElement;
  const [range,setRange]=useState('90');
  const [region,setRegion]=useState('all');
  const [topType,setTopType]=useState('stores');
  const [selectedStore,setSelectedStore]=useState('');

  const allTasks=Array.isArray(tasks)?tasks:[];
  const preOpeningTasks=allTasks.filter(t=>isPreOpeningLocation(t.locationType,t.storeCode));
  tasks=allTasks.filter(t=>!isPreOpeningLocation(t.locationType,t.storeCode));

  const now=Date.now();
  const dayMs=86400000;
  const rangeDays=range==='all'?null:Number(range||90);
  const validTime=v=>{const x=new Date(v).getTime();return Number.isFinite(x)?x:null;};
  const isCancelled=t=>(t.reviewStatus||'')==='cancelled'||t.workStatus==='cancelled';
  const needsAction=t=>!isCancelled(t)&&((t.type==='outsourced'&&t.workStatus!=='completed')||(t.reviewStatus||'pending')==='pending');
  const ageDays=t=>{const x=validTime(t.createdAt);return x===null?0:Math.max(0,(now-x)/dayMs);};
  const pct=(n,d)=>d?Math.round(n/d*100):0;
  const firstSub=t=>Array.isArray(t.level2)&&t.level2.length?String(t.level2[0]||''):'';
  const criticalCategory=t=>/یخچال|فریزر|برق|کرکره|بالابر|UPS|آتش|گاز|درب اتوماتیک/i.test(String(t.level1||'')+' '+firstSub(t));
  const completeLike=t=>!needsAction(t)&&!isCancelled(t);

  const regions=[...new Set(tasks.map(t=>t.region).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  const relevant=tasks.filter(t=>{
    if(region!=='all'&&t.region!==region)return false;
    if(rangeDays){
      const created=validTime(t.createdAt);
      if(created!==null&&created<now-rangeDays*dayMs)return false;
    }
    return !isCancelled(t);
  });

  const total=relevant.length;
  const actionTickets=relevant.filter(needsAction);
  const criticalOpen=actionTickets.filter(t=>ageDays(t)>=14||(ageDays(t)>=7&&criticalCategory(t)));
  const outsourced=relevant.filter(t=>t.type==='outsourced');
  const outsourcedShare=pct(outsourced.length,total);
  const internalShare=100-outsourcedShare;
  const completed=relevant.filter(completeLike);
  const finalCauseFilled=completed.filter(t=>String(t.finalCause||t.initialCause||'').trim()).length;
  const diagnosisCompleteness=pct(finalCauseFilled,completed.length);

  const repeatMap={};
  relevant.filter(t=>t.storeCode&&t.level1).forEach(t=>{
    const key=[String(t.storeCode),String(t.level1),firstSub(t)].join('|');
    if(!repeatMap[key])repeatMap[key]=[];
    repeatMap[key].push(t);
  });
  const repeatGroups=Object.entries(repeatMap)
    .filter(([,list])=>list.length>=2)
    .map(([key,list])=>({key,list,count:list.length,sample:list[0]}))
    .sort((a,b)=>b.count-a.count);

  const storeMap={};
  relevant.filter(t=>t.storeCode).forEach(t=>{
    const key=String(t.storeCode);
    if(!storeMap[key])storeMap[key]=[];
    storeMap[key].push(t);
  });
  const stores=Object.entries(storeMap).map(([code,list])=>{
    const open=list.filter(needsAction);
    const over7=open.filter(t=>ageDays(t)>=7);
    const over14=open.filter(t=>ageDays(t)>=14);
    const out=list.filter(t=>t.type==='outsourced').length;
    const critical=open.filter(criticalCategory).length;
    const localRepeat={};
    list.filter(t=>t.level1).forEach(t=>{
      const k=[String(t.level1),firstSub(t)].join('|');
      if(!localRepeat[k])localRepeat[k]=[];
      localRepeat[k].push(t);
    });
    const repeated=Object.values(localRepeat).filter(x=>x.length>=2).sort((a,b)=>b.length-a.length);
    const repeatCount=repeated.length?repeated[0].length:0;
    const repeatTitle=repeated.length?[repeated[0][0].level1,firstSub(repeated[0][0])].filter(Boolean).join(' / '):'';
    const oldest=Math.round(Math.max(0,...open.map(ageDays)));
    const outRate=pct(out,list.length);
    const risk=over14.length*7+over7.length*4+critical*4+open.length*2+(repeatCount>=2?repeatCount*4:0)+(outRate>=70&&list.length>=3?5:0);
    const first=list[0]||{};
    const reasons=[];
    if(over14.length)reasons.push(over14.length+' پرونده بیش از ۱۴ روز');
    else if(over7.length)reasons.push(over7.length+' پرونده بیش از ۷ روز');
    if(critical)reasons.push(critical+' خرابی حساس به عملیات');
    if(repeatCount>=2)reasons.push('تکرار '+repeatTitle+' ×'+repeatCount);
    if(outRate>=70&&list.length>=3)reasons.push(outRate+'٪ وابستگی به پیمانکار');
    return {code,name:first.storeName||('فروشگاه '+code),region:first.region||'',list,open:open.length,over7:over7.length,over14:over14.length,critical,repeatCount,repeatTitle,outRate,oldest,risk,reasons};
  }).sort((a,b)=>b.risk-a.risk||b.open-a.open||b.oldest-a.oldest);

  const riskStores=stores.filter(s=>s.risk>=6);
  const riskStoreCount=riskStores.length;

  const regionMap={};
  relevant.forEach(t=>{const k=t.region||'منطقه نامشخص';if(!regionMap[k])regionMap[k]=[];regionMap[k].push(t);});
  const regionRows=Object.entries(regionMap).map(([name,list])=>{
    const open=list.filter(needsAction);
    const over7=open.filter(t=>ageDays(t)>=7);
    const over14=open.filter(t=>ageDays(t)>=14);
    const out=list.filter(t=>t.type==='outsourced').length;
    const riskStoreSet=new Set(riskStores.filter(s=>s.region===name).map(s=>s.code));
    const outRate=pct(out,list.length);
    const oldest=Math.round(Math.max(0,...open.map(ageDays)));
    const risk=over14.length*7+over7.length*4+open.length*2+riskStoreSet.size*5+(outRate>=65&&list.length>=5?5:0);
    return {name,total:list.length,open:open.length,over7:over7.length,over14:over14.length,outRate,internalRate:100-outRate,oldest,riskStores:riskStoreSet.size,risk};
  }).sort((a,b)=>b.risk-a.risk||b.open-a.open);

  const categoryMap={};
  relevant.forEach(t=>{
    const key=t.level1||'نامشخص';
    if(!categoryMap[key])categoryMap[key]={name:key,total:0,open:0,over7:0,out:0,repeat:0};
    const x=categoryMap[key];x.total++;
    if(needsAction(t))x.open++;
    if(needsAction(t)&&ageDays(t)>=7)x.over7++;
    if(t.type==='outsourced')x.out++;
  });
  repeatGroups.forEach(g=>{const key=g.sample.level1||'نامشخص';if(categoryMap[key])categoryMap[key].repeat+=g.count;});
  const categoryRows=Object.values(categoryMap).map(x=>({...x,outRate:pct(x.out,x.total),attention:x.over7*5+x.open*2+x.repeat*3+x.out})).sort((a,b)=>b.attention-a.attention);

  const outsourceReasonMap={};
  outsourced.forEach(t=>{const k=String(t.outsourceReason||'علت ثبت نشده').trim()||'علت ثبت نشده';outsourceReasonMap[k]=(outsourceReasonMap[k]||0)+1;});
  const outsourceReasons=Object.entries(outsourceReasonMap).sort((a,b)=>b[1]-a[1]);

  const topRegion=regionRows[0];
  const topStore=riskStores[0];
  const topCategory=categoryRows[0];
  const topReason=outsourceReasons[0];

  const executiveSummary=[];
  executiveSummary.push(riskStoreCount+' فروشگاه در بازه انتخاب‌شده نشانه‌های ریسک عملیاتی دارند');
  executiveSummary.push(criticalOpen.length+' پرونده بحرانی هنوز تعیین تکلیف نشده است');
  executiveSummary.push(repeatGroups.length+' الگوی خرابی تکرارشونده شناسایی شده');
  executiveSummary.push(outsourcedShare+'٪ فعالیت‌ها به پیمانکار سپرده شده است');
  const summaryText=executiveSummary.join('؛ ')+'. این تحلیل بر مبنای داده‌های فعلی تیکتینگ است و هزینه، توقف واقعی و اثر فروش هنوز در سیستم ثبت نمی‌شود.';

  const decisions=[];
  if(topStore)decisions.push({no:'01',tone:'red',title:'مداخله در فروشگاه‌های پرریسک',evidence:topStore.code+' در صدر فهرست است؛ '+(topStore.reasons.slice(0,2).join(' و ')||topStore.open+' پرونده باز دارد')+'.',decision:'درخواست برنامه اقدام مشخص برای سه فروشگاه اول و گزارش نتیجه در جلسه بعد',storeCode:topStore.code});
  if(topCategory)decisions.push({no:'02',tone:'blue',title:'بازبینی راهبرد تجهیز و نگهداری',evidence:topCategory.name+' با '+topCategory.total+' تیکت، '+topCategory.over7+' معوق و '+topCategory.repeat+' ثبت تکراری، بالاترین توجه را می‌طلبد.',decision:'بررسی استاندارد خرید، سرویس پیشگیرانه و امکان جایگزینی تجهیزات پرتکرار'});
  if(topReason||topRegion)decisions.push({no:'03',tone:'gold',title:'تصمیم درباره ظرفیت داخلی یا پیمانکار',evidence:topReason?(topReason[0]+'، علت '+topReason[1]+' برون‌سپاری ثبت‌شده است.'):(topRegion.name+' با '+topRegion.outRate+'٪ برون‌سپاری بیشترین وابستگی را دارد.'),decision:'تعیین اینکه آموزش، ابزار، موجودی قطعه یا قرارداد منطقه‌ای کدام‌یک اقتصادی‌تر است'});
  while(decisions.length<3)decisions.push({no:'0'+(decisions.length+1),tone:'green',title:'موضوع فوری دیگری شناسایی نشد',evidence:'در داده‌های دوره، ریسک معنادار دیگری بالاتر از آستانه مشاهده نشد.',decision:'ادامه پایش و تکمیل داده‌های هزینه و توقف'});

  const riskCards=[
    {title:'تداوم عملیات',value:riskStoreCount,unit:'فروشگاه',status:riskStoreCount>=10?'بالا':riskStoreCount>=4?'متوسط':'کنترل‌شده',tone:riskStoreCount>=10?'red':riskStoreCount>=4?'gold':'green',note:'فروشگاه‌هایی با معوقه، خرابی حساس یا تکرار'},
    {title:'قابلیت اتکای تجهیزات',value:repeatGroups.length,unit:'الگوی تکرار',status:repeatGroups.length>=10?'بالا':repeatGroups.length>=4?'متوسط':'کنترل‌شده',tone:repeatGroups.length>=10?'red':repeatGroups.length>=4?'gold':'green',note:'تکرار احتمالی براساس فروشگاه و نوع خرابی'},
    {title:'ظرفیت داخلی سازمان',value:internalShare,unit:'٪ رفع داخلی',status:internalShare<45?'ضعیف':internalShare<65?'نیازمند تقویت':'مناسب',tone:internalShare<45?'red':internalShare<65?'gold':'green',note:'سهم کارهایی که بدون پیمانکار انجام شده‌اند'},
    {title:'شفافیت داده تصمیم',value:diagnosisCompleteness,unit:'٪ علت ثبت‌شده',status:diagnosisCompleteness<60?'پایین':diagnosisCompleteness<85?'قابل بهبود':'مناسب',tone:diagnosisCompleteness<60?'red':diagnosisCompleteness<85?'gold':'green',note:'تکمیل علت اولیه یا نهایی در پرونده‌های تعیین تکلیف‌شده'}
  ];

  const dateGroups={};
  relevant.forEach(t=>{const d=ticketDate(t);if(!d)return;if(!dateGroups[d])dateGroups[d]={total:0,action:0,out:0};dateGroups[d].total++;if(needsAction(t))dateGroups[d].action++;if(t.type==='outsourced')dateGroups[d].out++;});
  const trendRows=Object.keys(dateGroups).map(label=>({label,sort:ticketDateSortValue(label),...dateGroups[label]})).sort((a,b)=>a.sort-b.sort).slice(-24);
  const trendData={labels:trendRows.map(x=>x.label),datasets:[
    {label:'کل تیکت',data:trendRows.map(x=>x.total),borderColor:'#2546d8',backgroundColor:'rgba(37,70,216,.09)',fill:true,tension:.35,borderWidth:2.5,pointRadius:2.5},
    {label:'نیازمند اقدام',data:trendRows.map(x=>x.action),borderColor:'#e44f5f',backgroundColor:'#e44f5f',fill:false,tension:.35,borderWidth:2,pointRadius:2.5},
    {label:'برون‌سپاری',data:trendRows.map(x=>x.out),borderColor:'#b98a2f',backgroundColor:'#b98a2f',fill:false,tension:.35,borderWidth:2,pointRadius:2.5}
  ]};
  const trendOptions={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:7,color:'#6b7280',font:{family:'Vazirmatn',size:9}}}},scales:{x:{grid:{display:false},ticks:{color:'#858b96',font:{family:'Vazirmatn',size:8},autoSkip:true,maxTicksLimit:10,maxRotation:0}},y:{beginAtZero:true,ticks:{precision:0,color:'#858b96',font:{family:'Vazirmatn',size:8}},grid:{color:'rgba(25,35,55,.07)'}}}};

  const categoryData={labels:categoryRows.slice(0,7).map(x=>x.name),datasets:[{label:'شاخص توجه',data:categoryRows.slice(0,7).map(x=>x.attention),backgroundColor:'#1f2a44',borderRadius:8,borderSkipped:false}]};
  const categoryOptions={responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{display:false},grid:{display:false}},y:{grid:{display:false},ticks:{color:'#4b5563',font:{family:'Vazirmatn',size:9}}}}};

  const topTabs=[
    {id:'stores',label:'فروشگاه‌های پرریسک'},
    {id:'oldest',label:'قدیمی‌ترین پرونده‌ها'},
    {id:'repeat',label:'خرابی‌های تکراری'},
    {id:'regions',label:'مناطق پرریسک'},
    {id:'outsource',label:'وابستگی به پیمانکار'}
  ];

  let topRows=[];
  if(topType==='stores'){
    topRows=riskStores.slice(0,10).map(s=>({id:s.code,label:s.code+' — '+String(s.name).replace(/^فروشگاه\s*/,''),sub:[s.region,s.reasons.slice(0,2).join('؛ ')].filter(Boolean).join(' · '),value:s.risk,display:s.open+' پرونده باز',click:()=>setSelectedStore(s.code)}));
  }else if(topType==='oldest'){
    topRows=[...actionTickets].sort((a,b)=>ageDays(b)-ageDays(a)).slice(0,10).map(t=>({id:t.ticketNumber||t.rowNumber,label:(t.ticketNumber||'بدون شماره')+' — '+(t.storeCode||'بدون فروشگاه'),sub:[t.region,t.level1,firstSub(t),t.technician].filter(Boolean).join(' · '),value:Math.round(ageDays(t)),display:Math.round(ageDays(t))+' روز باز',click:()=>t.storeCode&&setSelectedStore(String(t.storeCode))}));
  }else if(topType==='repeat'){
    topRows=repeatGroups.slice(0,10).map(g=>({id:g.key,label:(g.sample.storeCode||'بدون فروشگاه')+' — '+(g.sample.level1||'خرابی'),sub:[g.sample.region,firstSub(g.sample)].filter(Boolean).join(' · '),value:g.count,display:g.count+' بار تکرار',click:()=>g.sample.storeCode&&setSelectedStore(String(g.sample.storeCode))}));
  }else if(topType==='regions'){
    topRows=regionRows.slice(0,10).map(r=>({id:r.name,label:r.name,sub:r.open+' پرونده باز · '+r.over7+' مورد بیش از ۷ روز · '+r.riskStores+' فروشگاه پرریسک',value:r.risk,display:r.outRate+'٪ برون‌سپاری'}));
  }else{
    topRows=[...regionRows].filter(r=>r.total>=3).sort((a,b)=>b.outRate-a.outRate||b.total-a.total).slice(0,10).map(r=>({id:r.name,label:r.name,sub:r.total+' تیکت · '+r.open+' پرونده باز · '+r.internalRate+'٪ رفع داخلی',value:r.outRate,display:r.outRate+'٪ پیمانکار'}));
  }
  const maxTop=Math.max(1,...topRows.map(x=>x.value||0));

  const selectedStoreData=selectedStore?stores.find(s=>s.code===selectedStore):null;
  const selectedTickets=selectedStoreData?[...selectedStoreData.list].sort((a,b)=>(validTime(b.createdAt)||0)-(validTime(a.createdAt)||0)).slice(0,14):[];
  const preProjectMap={};
  preOpeningTasks.forEach(t=>{
    const code=String(t.storeCode||'پروژه بدون کد');
    if(!preProjectMap[code])preProjectMap[code]=[];
    preProjectMap[code].push(t);
  });
  const preProjectRows=Object.entries(preProjectMap).map(([code,list])=>({
    code,
    name:(list[0]&&list[0].storeName)||code,
    region:(list[0]&&list[0].region)||'—',
    total:list.length,
    open:list.filter(needsAction).length
  })).sort((a,b)=>b.open-a.open||b.total-a.total);
  const preOpeningOpen=preOpeningTasks.filter(needsAction).length;

  const modalTicketEls=selectedTickets.map(t=>h('div',{className:'c8-ticket',key:t.ticketNumber||t.rowNumber},
    h('div',null,
      h('b',null,t.ticketNumber||('ردیف '+(t.rowNumber||''))),
      h('span',null,[t.level1,firstSub(t)].filter(Boolean).join(' / ')||'بدون شرح')
    ),
    h('div',null,
      h('span',null,t.dateText||ticketDate(t)||'—'),
      h('span',null,t.technician||'—'),
      h('em',{className:needsAction(t)?'warn':'ok'},needsAction(t)?'نیازمند اقدام':'تعیین تکلیف‌شده')
    )
  ));
  const modal=selectedStoreData?h('div',{className:'c8-modal-backdrop',onClick:e=>{if(e.target===e.currentTarget)setSelectedStore('');}},
    h('div',{className:'c8-modal'},
      h('div',{className:'c8-modal-head'},
        h('div',null,h('span',null,'شواهد فروشگاه'),h('h2',null,selectedStoreData.code+' — '+String(selectedStoreData.name).replace(/^فروشگاه\s*/,''))),
        h('button',{onClick:()=>setSelectedStore('')},'×')
      ),
      h('div',{className:'c8-modal-kpis'},
        h('div',null,h('b',null,selectedStoreData.open),h('span',null,'پرونده باز')),
        h('div',null,h('b',null,selectedStoreData.over7),h('span',null,'بیش از ۷ روز')),
        h('div',null,h('b',null,selectedStoreData.repeatCount),h('span',null,'تکرار محتمل')),
        h('div',null,h('b',null,selectedStoreData.outRate+'٪'),h('span',null,'پیمانکار'))
      ),
      h('div',{className:'c8-ticket-list'},...modalTicketEls)

function RegionalDashboard({tasks,onRefresh,loading,lastUpdated,currentUser,onLogout}){
  const h=React.createElement;
  const [tab,setTab]=useState('overview');
  const [range,setRange]=useState('30');
  const [regionFilter,setRegionFilter]=useState('all');
  const [locationFilter,setLocationFilter]=useState('all');
  const [store,setStore]=useState('all');
  const [tech,setTech]=useState('all');
  const [type,setType]=useState('all');
  const [selectedTicket,setSelectedTicket]=useState(null);

  const now=Date.now();
  const dayMs=86400000;
  const validTime=v=>{
    const x=new Date(v).getTime();
    return Number.isFinite(x)?x:null;
  };
  const ageDays=t=>{
    const x=validTime(t.createdAt);
    return x===null?0:Math.max(0,Math.floor((now-x)/dayMs));
  };
  const cancelled=t=>(t.reviewStatus||'')==='cancelled'||t.workStatus==='cancelled';
  const pending=t=>!cancelled(t)&&(t.reviewStatus||'pending')==='pending';
  const outsourceOpen=t=>!cancelled(t)&&t.type==='outsourced'&&t.workStatus!=='completed';
  const needsAction=t=>pending(t)||outsourceOpen(t);
  const rangeDays=range==='all'?null:Number(range||30);

  const assignedRegions=(Array.isArray(currentUser.regions)&&currentUser.regions.length
    ? currentUser.regions
    : [...new Set(tasks.map(t=>t.region).filter(Boolean))])
    .map(x=>String(x||'').trim())
    .filter(Boolean);

  const stores=[...new Map(tasks.filter(t=>
    t.storeCode &&
    (regionFilter==='all'||t.region===regionFilter) &&
    (locationFilter==='all'||(locationFilter==='preopening'&&isPreOpeningLocation(t.locationType,t.storeCode))||(locationFilter==='active'&&!isPreOpeningLocation(t.locationType,t.storeCode)))
  ).map(t=>[
    String(t.storeCode),
    {code:String(t.storeCode),name:t.storeName||('فروشگاه '+t.storeCode)}
  ])).values()].sort((a,b)=>a.code.localeCompare(b.code,'fa',{numeric:true}));

  const techs=[...new Set(tasks.map(t=>t.technician).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  const types=[...new Set(tasks.map(t=>t.level1).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));

  const filtered=tasks.filter(t=>{
    if(regionFilter!=='all'&&t.region!==regionFilter)return false;
    if(locationFilter==='preopening'&&!isPreOpeningLocation(t.locationType,t.storeCode))return false;
    if(locationFilter==='active'&&isPreOpeningLocation(t.locationType,t.storeCode))return false;
    if(rangeDays){
      const created=validTime(t.createdAt);
      if(created!==null&&created<now-rangeDays*dayMs)return false;
    }
    if(store!=='all'&&String(t.storeCode)!==store)return false;
    if(tech!=='all'&&t.technician!==tech)return false;
    if(type!=='all'&&t.level1!==type)return false;
    return true;
  });

  const active=filtered.filter(t=>!cancelled(t));
  const actionTickets=active.filter(needsAction);
  const overdue=actionTickets.filter(t=>ageDays(t)>=7);
  const internal=active.filter(t=>t.type==='internal');
  const outsourced=active.filter(t=>t.type==='outsourced');
  const completedOutsource=outsourced.filter(t=>t.workStatus==='completed');
  const internalRate=pct(internal.length,active.length);

  const dateGroups={};
  active.forEach(t=>{
    const d=ticketDate(t);
    if(!d)return;
    if(!dateGroups[d])dateGroups[d]={total:0,action:0,done:0};
    dateGroups[d].total++;
    if(needsAction(t))dateGroups[d].action++;
    else dateGroups[d].done++;
  });
  const trend=Object.entries(dateGroups)
    .map(([label,v])=>({label,sort:ticketDateSortValue(label),...v}))
    .sort((a,b)=>a.sort-b.sort)
    .slice(-12);

  const trendData={
    labels:trend.map(x=>x.label),
    datasets:[
      {label:'ثبت‌شده',data:trend.map(x=>x.total),borderColor:'#1f5f59',backgroundColor:'rgba(31,95,89,.12)',fill:true,tension:.35,borderWidth:2.5,pointRadius:3},
      {label:'نیازمند پیگیری',data:trend.map(x=>x.action),borderColor:'#e76f51',backgroundColor:'#e76f51',fill:false,tension:.35,borderWidth:2,pointRadius:3}
    ]
  };
  const trendOptions={
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:7,font:{size:10}}}},
    scales:{
      x:{grid:{display:false},ticks:{font:{size:9},autoSkip:false,maxRotation:0,minRotation:0}},
      y:{beginAtZero:true,ticks:{precision:0},grid:{color:'rgba(20,45,50,.07)'}}
    }
  };

  const categoryRows=sortedEntries(countBy(active,t=>t.level1||'نامشخص'),8);
  const categoryData={
    labels:categoryRows.map(x=>x[0]),
    datasets:[{label:'تعداد',data:categoryRows.map(x=>x[1]),backgroundColor:'#2b7a70',borderRadius:8,borderSkipped:false}]
  };
  const categoryOptions={
    responsive:true,maintainAspectRatio:false,indexAxis:'y',
    plugins:{legend:{display:false}},
    scales:{
      x:{beginAtZero:true,ticks:{precision:0},grid:{color:'rgba(20,45,50,.07)'}},
      y:{grid:{display:false},ticks:{font:{size:9}}}
    }
  };

  const storeMap={};
  active.forEach(t=>{
    const key=String(t.storeCode||'نامشخص');
    if(!storeMap[key])storeMap[key]=[];
    storeMap[key].push(t);
  });
  const storeRows=Object.entries(storeMap).map(([code,list])=>{
    const open=list.filter(needsAction);
    const old=open.filter(t=>ageDays(t)>=7);
    const out=list.filter(t=>t.type==='outsourced');
    const oldest=Math.max(0,...open.map(ageDays));
    const first=list[0]||{};
    return{
      code,
      name:first.storeName||('فروشگاه '+code),
      total:list.length,
      open:open.length,
      overdue:old.length,
      outsourceRate:pct(out.length,list.length),
      oldest,
      score:old.length*5+open.length*2+(oldest>=14?5:0)
    };
  }).sort((a,b)=>b.score-a.score||b.open-a.open||b.total-a.total);

  const techMap={};
  active.forEach(t=>{
    const key=t.technician||'نامشخص';
    if(!techMap[key])techMap[key]=[];
    techMap[key].push(t);
  });
  const techRows=Object.entries(techMap).map(([name,list])=>({
    name,
    total:list.length,
    open:list.filter(needsAction).length,
    overdue:list.filter(t=>needsAction(t)&&ageDays(t)>=7).length,
    internalRate:pct(list.filter(t=>t.type==='internal').length,list.length)
  })).sort((a,b)=>b.open-a.open||b.total-a.total);

  const topStore=storeRows[0];
  const topCategory=categoryRows[0];
  const oldestTicket=[...actionTickets].sort((a,b)=>ageDays(b)-ageDays(a))[0];

  const alerts=[];
  if(overdue.length){
    alerts.push({
      tone:'danger',
      title:overdue.length+' پرونده بیش از ۷ روز باز مانده',
      text:oldestTicket?'قدیمی‌ترین مورد '+ageDays(oldestTicket)+' روز سابقه دارد.':'نیازمند برنامه تعیین تکلیف است.',
      action:'مشاهده پرونده‌های باز',
      tab:'open'
    });
  }
  if(topStore&&topStore.open){
    alerts.push({
      tone:'warning',
      title:'تمرکز پرونده‌ها در '+topStore.code,
      text:topStore.open+' پرونده نیازمند پیگیری و '+topStore.overdue+' مورد معوق دارد.',
      action:'مشاهده وضعیت فروشگاه',
      tab:'stores'
    });
  }
  if(outsourced.length&&pct(outsourced.length,active.length)>=50){
    alerts.push({
      tone:'info',
      title:'وابستگی قابل‌توجه به برون‌سپاری',
      text:pct(outsourced.length,active.length)+'٪ فعالیت‌های دوره به پیمانکار ارجاع شده است.',
      action:'بررسی علت‌های برون‌سپاری',
      tab:'overview'
    });
  }
  if(!alerts.length){
    alerts.push({
      tone:'success',
      title:'موضوع بحرانی شناسایی نشد',
      text:'در فیلتر انتخاب‌شده، پرونده معوق یا تمرکز غیرعادی مشاهده نمی‌شود.',
      action:'ادامه پایش',
      tab:'overview'
    });
  }

  const kpi=(label,value,note,tone)=>h('div',{className:'rm-kpi '+tone},
    h('div',{className:'rm-kpi-label'},label),
    h('strong',null,value),
    h('span',null,note)
  );

  const ticketRows=[...actionTickets].sort((a,b)=>{
    const ageDiff=ageDays(b)-ageDays(a);
    return ageDiff!==0?ageDiff:(b.rowNumber||0)-(a.rowNumber||0);
  });

  const ticketStatus=t=>{
    if(ageDays(t)>=7)return{label:'معوق',tone:'danger'};
    if(outsourceOpen(t))return{label:'برون‌سپاری باز',tone:'warning'};
    return{label:'در انتظار بررسی',tone:'info'};
  };

  const ticketModal=selectedTicket?h('div',{
    className:'rm-modal-backdrop',
    onClick:e=>{if(e.target===e.currentTarget)setSelectedTicket(null);}
  },
    h('div',{className:'rm-modal'},
      h('div',{className:'rm-modal-head'},
        h('div',null,
          h('span',null,'جزئیات پرونده'),
          h('h2',null,selectedTicket.ticketNumber||('ردیف '+selectedTicket.rowNumber))
        ),
        h('button',{onClick:()=>setSelectedTicket(null)},'×')
      ),
      h('div',{className:'rm-detail-grid'},
        h('div',null,h('span',null,'فروشگاه'),h('b',null,(selectedTicket.storeCode||'—')+' — '+(selectedTicket.storeName||'بدون نام'))),
        h('div',null,h('span',null,'کارشناس'),h('b',null,selectedTicket.technician||'—')),
        h('div',null,h('span',null,'تاریخ ثبت'),h('b',null,selectedTicket.dateText||ticketDate(selectedTicket)||'—')),
        h('div',null,h('span',null,'سن پرونده'),h('b',null,ageDays(selectedTicket)+' روز')),
        h('div',null,h('span',null,'نوع انجام'),h('b',null,selectedTicket.type==='outsourced'?'برون‌سپاری':'درون‌سپاری')),
        h('div',null,h('span',null,'وضعیت'),h('b',null,ticketStatus(selectedTicket).label))
      ),
      h('div',{className:'rm-detail-block'},h('span',null,'شرح خرابی'),h('p',null,[selectedTicket.level1,...(selectedTicket.level2||[])].filter(Boolean).join(' / ')||'ثبت نشده')),
      h('div',{className:'rm-detail-block'},h('span',null,'تشخیص اولیه'),h('p',null,[selectedTicket.initialCause,selectedTicket.initialCauseDetails].filter(Boolean).join(' — ')||'ثبت نشده')),
      h('div',{className:'rm-detail-block'},h('span',null,'علت نهایی'),h('p',null,[selectedTicket.finalCause,selectedTicket.finalCauseDetails].filter(Boolean).join(' — ')||'هنوز ثبت نشده')),
      selectedTicket.outsourceReason&&h('div',{className:'rm-detail-block'},h('span',null,'علت برون‌سپاری'),h('p',null,selectedTicket.outsourceReason)),
      selectedTicket.managerNote&&h('div',{className:'rm-detail-block'},h('span',null,'یادداشت مدیر فنی'),h('p',null,selectedTicket.managerNote))
    )
  ):null;

  return h('div',{className:'rm-shell'},
    h('header',{className:'rm-header'},
      h('div',{className:'rm-brand'},
        h('div',{className:'rm-mark'},'DM'),
        h('div',null,
          h('b',null,currentUser.role==='executive_manager'?'پایش پشتیبانی فنی مناطق':'پایش پشتیبانی فنی منطقه'),
          h('span',null,currentUser.role==='executive_manager'?'داشبورد فقط خواندنی مدیر اجرایی':'داشبورد فقط خواندنی مدیر منطقه')
        )

        h('div',null,h('b',null,currentUser.name||(currentUser.role==='executive_manager'?'مدیر اجرایی':'مدیر منطقه')),h('span',null,assignedRegions.length+' منطقه تحت پوشش')),

function LoginView({ onLogin }){
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const usernameRef = useRef(null);
  const passwordRef = useRef(null);
  const requestSeq = useRef(0);

  useEffect(()=>{
    // هیچ تلاش ناموفقی در مرورگر ذخیره یا قفل نمی‌شود.
    // ورود قبلیِ ناقص نیز پاک می‌شود تا کاربران فعلی بتوانند دوباره تلاش کنند.
    try{ sessionStorage.removeItem('ticketing-user-v115'); }catch(e){}
  },[]);

  const clearError = () => {
    if(error) setError('');
  };

  const resetLoginForm = () => {
    requestSeq.current += 1; // پاسخ هر درخواست قبلی دیگر اثری ندارد
    setLoading(false);
    setError('');
    setUsername('');
    setPassword('');
    try{ sessionStorage.removeItem('ticketing-user-v115'); }catch(e){}
    setTimeout(()=>usernameRef.current && usernameRef.current.focus(),30);
  };

  const submit = async (event) => {
    if(event && event.preventDefault) event.preventDefault();
    if(loading) return;

    // مقدار واقعی داخل کادر خوانده می‌شود تا Autofill موبایل مقدار قدیمی نفرستد.
    const rawUsername = usernameRef.current ? usernameRef.current.value : username;
    const rawPassword = passwordRef.current ? passwordRef.current.value : password;
    const cleanUsername = normalizeLoginDigits(rawUsername);
    const cleanPassword = normalizeLoginDigits(rawPassword);

    setUsername(cleanUsername);
    setPassword(cleanPassword);

    if(!cleanUsername || !cleanPassword){
      setError('نام کاربری و رمز عبور را وارد کنید');
      if(!cleanUsername){
        setTimeout(()=>usernameRef.current && usernameRef.current.focus(),30);
      }else{
        setTimeout(()=>passwordRef.current && passwordRef.current.focus(),30);
      }
      return;
    }

    const myRequest = ++requestSeq.current;
    setLoading(true);
    setError('');

    try{
      const result = await loginWithSheet(cleanUsername, cleanPassword);
      if(myRequest !== requestSeq.current) return;

      if(result && result.success){
        // هیچ خطای قبلی یا نشست ناقصی به ورود درست منتقل نمی‌شود.
        try{ sessionStorage.removeItem('ticketing-user-v115'); }catch(e){}
        onLogin({
          username: String(result.username || cleanUsername).trim(),
          name: String(result.name || '').trim(),
          role: result.role === 'admin'
            ? 'admin'
            : (result.role === 'manager'
              ? 'manager'
              : ((result.role === 'regional_manager' || result.role === 'executive_manager')
                ? result.role
                : 'technician')),
          region: String(result.region || '').trim(),
          regions: Array.isArray(result.regions)
            ? result.regions.map(x=>String(x||'').trim()).filter(Boolean)
            : String(result.region||'').split('|').map(x=>x.trim()).filter(Boolean),
          token: String(result.token || '')
        });
        return;
      }

      setError((result && result.message) || 'نام کاربری یا رمز عبور اشتباه است');
      // بعد از اشتباه، رمز پاک می‌شود و کاربر فوراً می‌تواند دوباره وارد کند.
      setPassword('');
      if(passwordRef.current) passwordRef.current.value='';
      setTimeout(()=>passwordRef.current && passwordRef.current.focus(),30);
    }catch(e){
      if(myRequest !== requestSeq.current) return;
      setError('ارتباط با سرور برقرار نشد؛ دوباره تلاش کنید');
      setTimeout(()=>passwordRef.current && passwordRef.current.focus(),30);
    }finally{
      if(myRequest === requestSeq.current) setLoading(false);
    }
  };

  return React.createElement('div',{className:'wrap'},
    React.createElement('div',{className:'login-wrap'},
      React.createElement('form',{className:'login-card',onSubmit:submit,noValidate:true,autoComplete:'off'},
        React.createElement('div',{className:'login-head'},
          React.createElement('div',{className:'login-icon'},'🧰'),
          React.createElement('h2',null,'ورود به پشتیبانی فنی'),
          React.createElement('p',null,'با نام کاربری، ایمیل یا کد پرسنلی خود وارد شوید')
        ),
        error && React.createElement('div',{className:'login-error',role:'alert'},error),
        React.createElement('label',{htmlFor:'ticketing-username'},'نام کاربری یا ایمیل'),
        React.createElement('input',{
          id:'ticketing-username',
          ref:usernameRef,
          name:'username',
          type:'text',
          value:username,
          onChange:e=>{setUsername(e.target.value);clearError();},
          inputMode:'email',
          autoComplete:'username',
          autoCapitalize:'none',
          autoCorrect:'off',
          spellCheck:false,
          enterKeyHint:'next',
          dir:'ltr',
          'data-lpignore':'true',
          'data-1p-ignore':'true',
          placeholder:'ایمیل، نام کاربری یا کد پرسنلی'
        }),
        React.createElement('label',{htmlFor:'ticketing-password'},'رمز عبور'),
        React.createElement('input',{
          id:'ticketing-password',
          ref:passwordRef,
          name:'password',
          type:'password',
          value:password,
          onChange:e=>{setPassword(e.target.value);clearError();},
          inputMode:'text',
          autoComplete:'current-password',
          autoCapitalize:'none',
          autoCorrect:'off',
          spellCheck:false,
          enterKeyHint:'go',
          dir:'ltr',
          'data-lpignore':'true',
          'data-1p-ignore':'true',
          placeholder:'رمز عبور'
        }),
        React.createElement('div',{className:'login-actions'},
          React.createElement('button',{
            type:'submit',
            className:'btn btn-primary',
            disabled:loading
          },loading?'در حال بررسی...':'ورود'),
          React.createElement('button',{
            type:'button',
            className:'login-reset',
            onClick:resetLoginForm
          },'پاک کردن فرم و تلاش دوباره')
        ),
        React.createElement('div',{className:'login-note'},'تعداد ورود اشتباه باعث قفل شدن حساب نمی‌شود؛ هر زمان اطلاعات درست وارد شود، ورود انجام خواهد شد.')
      )
    )
  );
}

/* ---------- اپ اصلی ---------- */
function App(){
  const [currentUser,setCurrentUser]=useState(()=>{try{const raw=sessionStorage.getItem('ticketing-user-v115');return raw?JSON.parse(raw):null;}catch(e){return null;}});
  const [tasks,setTasks]=useState([]);
  const [technicianDirectory,setTechnicianDirectory]=useState([]);
  const [activeStoreDirectory,setActiveStoreDirectory]=useState([]);
  const [loaded,setLoaded]=useState(false);
  const [managerLoading,setManagerLoading]=useState(false);
  const [lastUpdated,setLastUpdated]=useState('');
  const [toastMsg,setToastMsg]=useState('');
  const toastTimer=useRef(null);
  const lastSyncError=useRef('');
  const dataRevisionRef=useRef('');
  const lastFullSyncRef=useRef(0);
  const revisionPollBusyRef=useRef(false);
  const role=currentUser
    ? (currentUser.role==='admin'
      ? 'admin'
      : (currentUser.role==='manager'
        ? 'manager'
        : ((currentUser.role==='regional_manager'||currentUser.role==='executive_manager')
          ? 'regional'
          : 'tech')))
    : null;
  const showToast=m=>{setToastMsg(m);clearTimeout(toastTimer.current);toastTimer.current=setTimeout(()=>setToastMsg(''),2600);};

  const handleLogin=user=>{
    sessionStorage.setItem('ticketing-user-v115',JSON.stringify(user));
    dataRevisionRef.current='';
    lastFullSyncRef.current=0;
    setCurrentUser(user);
    setLoaded(false);
  };
  const logout=()=>{
    sessionStorage.removeItem('ticketing-user-v115');
    dataRevisionRef.current='';
    lastFullSyncRef.current=0;
    setCurrentUser(null);
    setTasks([]);
    setTechnicianDirectory([]);
    setActiveStoreDirectory([]);
    setLoaded(false);
  };

  const loadTasks=useCallback(async(options={})=>{
    if(!currentUser)return;
    const silent=!!(options&&options.silent);

    const showSyncErrorOnce=(message)=>{
      const msg=String(message||'').trim();
      if(!msg||lastSyncError.current===msg)return;
      lastSyncError.current=msg;
      showToast(msg);
    };

    if(currentUser.role==='manager'||currentUser.role==='admin'||currentUser.role==='regional_manager'||currentUser.role==='executive_manager'){
      if(!currentUser.token){logout();return;}
      if(!silent)setManagerLoading(true);
      try{
        const fetchForRole=()=>currentUser.role==='admin'
          ? fetchExecutiveTickets(currentUser.token)
          : ((currentUser.role==='regional_manager'||currentUser.role==='executive_manager')
            ? fetchRegionalTickets(currentUser.token)
            : fetchManagerTickets(currentUser.token));

        let result=await fetchForRole();

        // گاهی بلافاصله بعد از ورود، درخواست داشبورد زودتر از تثبیت نشست می‌رسد.
        // یک بار بدون خروج کاربر دوباره بررسی می‌کنیم.
        if(result&&result.sessionExpired){
          await new Promise(resolve=>setTimeout(resolve,900));
          result=await fetchForRole();
        }

        if(result&&result.success){
          lastSyncError.current='';
          setTasks(result.tickets||[]);
          if(currentUser.role==='manager'){
            setTechnicianDirectory(Array.isArray(result.technicians)?result.technicians:[]);
            setActiveStoreDirectory(Array.isArray(result.activeStores)?result.activeStores:[]);
          }
          dataRevisionRef.current=String(result.revision||dataRevisionRef.current||'0');
          lastFullSyncRef.current=Date.now();
          setLastUpdated(result.updatedAt||new Date().toISOString());
          setLoaded(true);
        }else if(result&&result.sessionExpired){
          showToast(result.message||'نشست معتبر نیست؛ دوباره وارد شوید');
          setTimeout(logout,900);
        }else{
          // خطاهای silent مربوط به درخواست‌های پس‌زمینه به کاربر نمایش داده نمی‌شوند.
          if(!(result&&result.silent)){
            showSyncErrorOnce((result&&result.message)||'دریافت داده‌ها انجام نشد');
          }
          setLoaded(true);
        }
      }catch(e){
        showSyncErrorOnce('ارتباط با داده‌های مدیریتی برقرار نشد');
        setLoaded(true);
      }finally{
        if(!silent)setManagerLoading(false);
      }
    }else{
      if(!currentUser.token){logout();return;}
      try{
        const result=await fetchTechnicianTickets(currentUser.token);
        if(result&&result.success){
          lastSyncError.current='';
          setTasks(result.tickets||[]);
          dataRevisionRef.current=String(result.revision||dataRevisionRef.current||'0');
          lastFullSyncRef.current=Date.now();
          setLastUpdated(result.updatedAt||new Date().toISOString());
          setLoaded(true);
        }else if(result&&result.sessionExpired){
          showToast(result.message||'دوباره وارد شوید');
          logout();
        }else{
          if(!(result&&result.silent)){
            showSyncErrorOnce((result&&result.message)||'دریافت کارهای شما انجام نشد');
          }
          setLoaded(true);
        }
      }catch(e){
        try{
          const res=await window.storage.get('tasks',true);
          setTasks(res?JSON.parse(res.value):[]);
        }catch(_){
          setTasks([]);
        }
        showSyncErrorOnce('ارتباط با سرور برقرار نشد؛ اطلاعات محلی نمایش داده شد');
        setLoaded(true);
      }
    }
  },[currentUser]);

  const checkForUpdates=useCallback(async()=>{
    if(!currentUser||!currentUser.token||revisionPollBusyRef.current)return;
    revisionPollBusyRef.current=true;

    try{
      const result=await fetchDataRevision(currentUser.token);

      if(result&&result.sessionExpired){
        showToast(result.message||'نشست معتبر نیست؛ دوباره وارد شوید');
        logout();
        return;
      }

      if(!(result&&result.success))return;

      const incomingRevision=String(result.revision||'0');
      const currentRevision=String(dataRevisionRef.current||'');
      const forceSafetyRefresh=Date.now()-Number(lastFullSyncRef.current||0)>300000;

      if(!currentRevision||incomingRevision!==currentRevision||forceSafetyRefresh){
        await loadTasks({silent:true});
      }
    }catch(e){
      // بررسی نسخه یک درخواست بسیار سبک پس‌زمینه است؛
      // خطای لحظه‌ای آن نباید تجربه کاربر را مختل کند.
    }finally{
      revisionPollBusyRef.current=false;
    }
  },[currentUser,loadTasks]);

  useEffect(()=>{
    if(!currentUser)return;
    loadTasks();

    // به جای دانلود کامل تمام Tickets هر 15/30 ثانیه،
    // فقط یک Revision چندبایتی بررسی می‌شود.
    const intervalMs=(currentUser.role==='manager'||currentUser.role==='admin'||currentUser.role==='regional_manager'||currentUser.role==='executive_manager')
      ?20000
      :12000;

    const iv=setInterval(checkForUpdates,intervalMs);
    return()=>clearInterval(iv);
  },[currentUser,loadTasks,checkForUpdates]);

  const saveTasks=async updater=>{
    const next=updater(tasks);
    // رابط کاربری بلافاصله آپدیت می‌شود؛ ذخیره محلی در پس‌زمینه است.
    setTasks(next);
    Promise.resolve()
      .then(()=>window.storage.set('tasks',JSON.stringify(next),true))
      .catch(()=>{});
    return next;
  };

  const updateManagerTask=async(id,patch)=>{
    const original=tasks.find(t=>t.id===id);if(!original)return;

    const serverVerified=!!patch.__serverVerifiedReview;
    const cleanPatch={...patch};
    delete cleanPatch.__serverVerifiedReview;

    const updated={
      ...original,
      ...cleanPatch,
      managerNote:cleanPatch.managerNote!==undefined
        ?(cleanPatch.managerNote||original.managerNote)
        :original.managerNote
    };

    setTasks(list=>list.map(t=>t.id===id?updated:t));

    if(serverVerified){
      // Review/Reject has already been written and read-back verified by Apps Script.
      setTimeout(()=>loadTasks({silent:true}),500);
      return;
    }

    try{
      await sendManagerUpdate(updated,currentUser.token,cleanPatch);
      setTimeout(()=>loadTasks({silent:true}),850);
    }catch(e){
      showToast('ارسال تغییرات انجام نشد');
      setTimeout(()=>loadTasks({silent:true}),400);
    }
  };

  if(!currentUser)return React.createElement(LoginView,{onLogin:handleLogin});

  if(role==='admin'){
    return React.createElement('div',{className:'ceo-page'},
      !loaded?React.createElement('div',{className:'c8-empty',style:{paddingTop:'25vh'}},'در حال بارگذاری داشبورد مدیرعامل...'):React.createElement(CEODashboard,{tasks,onRefresh:loadTasks,loading:managerLoading,lastUpdated,currentUser,onLogout:logout}),
      React.createElement(Toast,{msg:toastMsg})
    );
  }

  if(role==='regional'){
    return !loaded
      ? React.createElement('div',{className:'rm-shell'},React.createElement('div',{className:'rm-loading'},'در حال بارگذاری اطلاعات منطقه...'))
      : React.createElement(React.Fragment,null,
          React.createElement(RegionalDashboard,{tasks,onRefresh:loadTasks,loading:managerLoading,lastUpdated,currentUser,onLogout:logout}),
          React.createElement(Toast,{msg:toastMsg})
        );
  }

  return React.createElement('div',{className:'wrap'},
    React.createElement('div',{className:'top'},
      React.createElement('div',{className:'brand'},React.createElement('span',{className:'dot'}),React.createElement('div',null,React.createElement('h1',null,'پشتیبانی فنی فروشگاه‌ها'),React.createElement('span',null,(role==='tech'?'محیط نیروی فنی':'مرکز کنترل مدیریت فنی')+' • نسخه 11.5'))),
      React.createElement('div',{className:'user-bar'},React.createElement('div',{className:'user-info'},React.createElement('b',null,currentUser.name),React.createElement('span',null,role==='manager'?'مدیر فنی':'کد پرسنلی: '+currentUser.username)),React.createElement('button',{className:'logout-btn',onClick:logout},'خروج'))
    ),
    !loaded?React.createElement('div',{className:'empty'},'در حال بارگذاری اطلاعات...'):(role==='tech'?React.createElement(TechView,{tasks,saveTasks,showToast,currentUser,refreshTasks:loadTasks}):React.createElement(ManagerView,{tasks,updateTask:updateManagerTask,showToast,refreshTasks:loadTasks,managerLoading,lastUpdated,currentUser,technicianDirectory,activeStoreDirectory})),
    React.createElement(Toast,{msg:toastMsg})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
