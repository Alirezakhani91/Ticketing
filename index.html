<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>مرکز پایش عملکرد فنی و تصمیم‌یار تجهیز - v6.0</title>
<!-- Executive decision intelligence redesign: 6.0 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4f5f3;
    --surface: #ffffff;
    --ink: #1c2321;
    --ink-soft: #5b645f;
    --line: #e3e6e2;
    --accent: #2f6f5e;
    --accent-soft: #e6efec;
    --amber: #b8721f;
    --amber-soft: #fbeedd;
    --red: #a8382c;
    --red-soft: #f8e9e7;
    --blue: #2b5a8c;
    --blue-soft: #e8eef5;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(28,35,33,0.04), 0 6px 20px rgba(28,35,33,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Vazirmatn', sans-serif;min-height:100vh;}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 16px 60px;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .brand h1{font-size:16px;font-weight:700;margin:0;}
  .brand span{display:block;font-size:11px;color:var(--ink-soft);font-weight:500;}
  .role-switch{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;}
  .role-switch button{border:none;background:transparent;padding:7px 14px;border-radius:999px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .role-switch button.active{background:var(--ink);color:#fff;}

  .gate{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;}
  .gate h2{font-size:21px;margin:0;font-weight:800;}
  .gate p{color:var(--ink-soft);margin:0;font-size:13.5px;max-width:340px;}
  .gate-cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .gate-card{width:190px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 16px;cursor:pointer;transition:.18s;box-shadow:var(--shadow);}
  .gate-card:hover{transform:translateY(-3px);border-color:var(--accent);}
  .gate-card .ic{font-size:26px;margin-bottom:10px;}
  .gate-card b{font-size:14px;display:block;margin-bottom:4px;}
  .gate-card span{font-size:11.5px;color:var(--ink-soft);}

  .login-wrap{min-height:82vh;display:flex;align-items:center;justify-content:center;padding:20px 0;}
  .login-card{width:100%;max-width:390px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px;}
  .login-head{text-align:center;margin-bottom:22px;}
  .login-icon{width:54px;height:54px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:25px;margin:0 auto 12px;}
  .login-head h2{font-size:19px;margin:0 0 6px;font-weight:800;}
  .login-head p{font-size:12px;color:var(--ink-soft);margin:0;line-height:1.9;}
  .login-error{background:var(--red-soft);color:var(--red);border-radius:9px;padding:9px 11px;font-size:12px;margin-bottom:12px;text-align:center;}
  .login-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px;}
  .login-reset{border:0;background:transparent;color:var(--ink-soft);font-family:inherit;font-size:11px;font-weight:700;padding:8px;cursor:pointer;}
  .login-reset:hover{color:var(--accent);}
  .login-note{margin-top:10px;text-align:center;color:var(--ink-soft);font-size:10px;line-height:1.8;}
  .user-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .user-info{text-align:left;direction:rtl;}
  .user-info b{display:block;font-size:12px;}
  .user-info span{display:block;font-size:10.5px;color:var(--ink-soft);}
  .logout-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:9px;padding:7px 11px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;}
  .fixed-user{background:var(--accent-soft);border:1px solid #d7e7e1;border-radius:10px;padding:10px 12px;margin-bottom:12px;}
  .fixed-user b{display:block;font-size:13px;}
  .fixed-user span{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
  .card h3{margin:0 0 4px;font-size:14.5px;font-weight:700;}
  .card .sub{margin:0 0 14px;font-size:11.5px;color:var(--ink-soft);}
  label{display:block;font-size:12px;color:var(--ink-soft);margin:0 0 5px;font-weight:600;}
  input,select,textarea{width:100%;font-family:inherit;font-size:13.5px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fbfbfa;color:var(--ink);margin-bottom:12px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:#fff;}
  textarea{resize:vertical;min-height:64px;}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;}
  .btn-primary{background:var(--ink);color:#fff;width:100%;}
  .btn-primary:hover{background:#000;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-line{background:#fff;border:1px solid var(--line);color:var(--ink);width:100%;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-size:11.5px;padding:5px 10px;border-radius:8px;cursor:pointer;}

  /* انتخاب نوع کار */
  .choice-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  @media(max-width:480px){.choice-row{grid-template-columns:1fr;}}
  .choice{border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:center;transition:.12s;}
  .choice b{display:block;font-size:13px;margin-bottom:2px;}
  .choice span{font-size:11px;color:var(--ink-soft);}
  .choice.sel-internal{border-color:var(--accent);background:var(--accent-soft);}
  .choice.sel-outsourced{border-color:var(--blue);background:var(--blue-soft);}

  .radio-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .radio-item{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:12.5px;}
  .radio-item.checked{border-color:var(--blue);background:var(--blue-soft);}
  .radio-item input{width:auto;margin:2px 0 0;flex-shrink:0;}

  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;cursor:pointer;background:#fff;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}

  .part-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 44px;gap:8px;align-items:center;margin-bottom:8px;}
  .part-row>input{margin-bottom:0;}
  .qty-direct{
    display:block!important;
    width:100%!important;
    min-width:0!important;
    height:46px!important;
    margin:0!important;
    padding:0 10px!important;
    border:1px solid var(--line)!important;
    border-radius:10px!important;
    background:#fff!important;
    color:var(--ink)!important;
    text-align:center!important;
    font-family:inherit!important;
    font-size:16px!important;
    font-weight:800!important;
    direction:ltr!important;
    -webkit-appearance:none!important;
    appearance:none!important;
  }
  .qty-direct:focus{outline:none!important;border-color:var(--accent)!important;box-shadow:0 0 0 2px rgba(47,111,94,.08)!important;}
  .qty-direct::placeholder{font-size:12px;font-weight:600;color:#9aa19d;opacity:1;}
  .rm-btn{border:none;background:var(--red-soft);color:var(--red);border-radius:10px;width:44px;height:46px;font-size:16px;cursor:pointer;}
  @media(max-width:520px){
    .part-row{grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:stretch;}
    .part-row>input{grid-column:1 / -1;height:48px;}
    .qty-direct{grid-column:1;grid-row:2;height:50px!important;font-size:18px!important;}
    .rm-btn{grid-column:2;grid-row:2;width:44px;height:50px;}
  }
  .add-part{border:1px dashed var(--line);background:transparent;color:var(--ink-soft);border-radius:9px;padding:8px;width:100%;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:14px;}

  .visit-banner{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;}
  .visit-banner b{font-size:15px;}
  .visit-banner button{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-family:inherit;font-size:11px;cursor:pointer;}

  .task{border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px;}
  .task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
  .task-store{font-weight:800;font-size:13.5px;}
  .task-meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .ticket-number{display:inline-flex;align-items:center;direction:ltr;background:#eef1ef;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:10px;font-weight:800;letter-spacing:.3px;margin-bottom:5px;}
  .ticket-number.pending-number{direction:rtl;color:var(--ink-soft);font-weight:600;letter-spacing:0;}
  .r-cancelled{background:#eceeed;color:#59605c;}
  .cancelled-box{background:#f0f1f0;border:1px solid #dde0de;border-radius:9px;padding:9px 11px;font-size:11.5px;color:#59605c;margin-top:8px;line-height:1.9;}
  .ticket-lock{font-size:10.5px;color:var(--ink-soft);background:#fafafa;border:1px dashed var(--line);border-radius:8px;padding:7px 9px;margin-top:8px;}
  .tech-edit-panel{margin-top:11px;padding-top:12px;border-top:1px solid var(--line);}
  .tech-edit-store{background:#fafafa;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:12px;}
  .tech-edit-store input{margin-bottom:8px;}
  .danger-confirm{background:var(--red-soft)!important;color:var(--red)!important;border-color:#efc9c4!important;}
  .task-desc{font-size:12.5px;color:var(--ink);margin:8px 0;line-height:2;}
  .task-desc b{font-weight:700;}
  .badge{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;}
  .b-internal{background:var(--accent-soft);color:var(--accent);}
  .b-outsourced{background:var(--blue-soft);color:var(--blue);}
  .review-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;margin-inline-start:6px;}
  .r-pending{background:var(--amber-soft);color:var(--amber);}
  .r-reviewed{background:var(--accent-soft);color:var(--accent);}
  .r-rejected{background:var(--red-soft);color:var(--red);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .a-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
  .a-ok{color:var(--accent);border-color:var(--accent-soft);}
  .a-edit{color:var(--blue);border-color:var(--blue-soft);}
  .a-reject{color:var(--red);border-color:var(--red-soft);}
  .note{font-size:11.5px;color:var(--ink-soft);margin-top:6px;background:#fafafa;padding:6px 10px;border-radius:8px;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:12px;}
  .tabs button{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:9px;font-family:inherit;font-weight:700;font-size:12px;color:var(--ink-soft);cursor:pointer;}
  .tabs button.active{background:var(--bg);color:var(--ink);}
  .empty{text-align:center;padding:36px 10px;color:var(--ink-soft);font-size:13px;}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .stat b{display:block;font-size:22px;font-weight:800;}
  .stat span{font-size:10.5px;color:var(--ink-soft);}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);}
  th{color:var(--ink-soft);font-weight:700;font-size:11px;}
  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .filter-row input,.filter-row select{width:auto;margin:0;flex:1;min-width:120px;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;}
  .bar-label{width:150px;flex-shrink:0;color:var(--ink-soft);}
  .bar-track{flex:1;height:8px;background:var(--bg);border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:99px;}
  .bar-count{width:26px;text-align:left;font-weight:700;}



  /* شناسایی خودکار فروشگاه */
  .store-lookup{margin-top:-2px;margin-bottom:12px;min-height:54px;}
  .store-search-status{display:flex;align-items:center;gap:8px;border:1px dashed var(--line);background:#fafafa;border-radius:11px;padding:11px 12px;color:var(--ink-soft);font-size:11.5px;}
  .store-search-status.loading:before{content:'';width:13px;height:13px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:storeSpin .8s linear infinite;}
  @keyframes storeSpin{to{transform:rotate(360deg)}}
  .store-found{border:1px solid #cfe1db;background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .store-found b{display:block;font-size:13px;margin-bottom:3px;}
  .store-found span{display:block;font-size:10.5px;color:var(--ink-soft);}
  .store-code-badge{background:#fff;border:1px solid rgba(47,111,94,.18);border-radius:9px;padding:7px 10px;font-size:11px;font-weight:800;white-space:nowrap;color:var(--accent);}
  .store-invalid{border:1px solid #efd2ce;background:var(--red-soft);border-radius:11px;padding:10px 12px;color:var(--red);font-size:11.5px;font-weight:600;}
  .store-submeta{font-size:10px;color:var(--ink-soft);margin-top:3px;}
  .region-name{font-weight:700;color:var(--accent);}

  /* داشبورد مدیریتی */
  .dashboard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .dashboard-title h2{font-size:21px;margin:0 0 5px;font-weight:800;}
  .dashboard-title p{margin:0;color:var(--ink-soft);font-size:12px;}
  .refresh-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;}
  .refresh-btn:disabled{opacity:.55;cursor:not-allowed;}
  .dashboard-filters{display:grid;grid-template-columns:1.2fr repeat(6,1fr);gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px;box-shadow:var(--shadow);}
  .dashboard-filters select,.dashboard-filters input{margin:0;min-width:0;}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  .kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);min-height:104px;}
  .kpi:after{content:'';position:absolute;width:66px;height:66px;border-radius:50%;left:-22px;bottom:-28px;background:var(--accent-soft);opacity:.72;}
  .kpi.blue:after{background:var(--blue-soft);}.kpi.amber:after{background:var(--amber-soft);}.kpi.red:after{background:var(--red-soft);}
  .kpi-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .kpi-label{font-size:11px;color:var(--ink-soft);font-weight:700;}
  .kpi-icon{font-size:17px;}
  .kpi-value{display:block;font-size:28px;font-weight:800;margin-top:10px;line-height:1;}
  .kpi-note{display:block;font-size:10px;color:var(--ink-soft);margin-top:7px;}
  .dash-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-bottom:14px;}
  .dash-grid.equal{grid-template-columns:1fr 1fr;}
  .dash-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0;}
  .dash-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:13px;}
  .dash-card-head h3{font-size:14px;margin:0 0 3px;}
  .dash-card-head p{font-size:10.5px;color:var(--ink-soft);margin:0;}
  .chart-wrap{position:relative;height:280px;direction:ltr;}
  .chart-wrap.small{height:245px;}
  .leader-list{display:flex;flex-direction:column;gap:9px;}
  .leader-item{display:grid;grid-template-columns:34px minmax(120px,1.5fr) 1fr 62px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;}
  .leader-item:last-child{border-bottom:none;}
  .rank{width:28px;height:28px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
  .rank.top{background:var(--amber-soft);color:var(--amber);}
  .leader-name b{display:block;font-size:12px;}.leader-name span{font-size:10px;color:var(--ink-soft);}
  .mini-track{height:7px;border-radius:99px;background:var(--bg);overflow:hidden;}
  .mini-fill{height:100%;border-radius:99px;background:var(--accent);}
  .leader-total{text-align:left;font-weight:800;font-size:13px;}
  .leader-total span{display:block;font-size:9px;color:var(--ink-soft);font-weight:500;}
  .store-table-wrap{overflow:auto;max-height:520px;}
  .store-table{min-width:760px;}
  .store-summary-row{cursor:pointer;transition:background .18s ease;}
  .store-summary-row:hover,.store-summary-row.expanded{background:#f7faf8;}
  .store-summary-row td:first-child{font-weight:800;color:var(--accent);}
  .store-expand-cell{white-space:nowrap;min-width:150px;}
  .store-main-ticket{display:inline-block;font-size:10.5px;font-weight:900;color:var(--accent);direction:ltr;}
  .store-expand-icon{display:inline-flex;width:22px;height:22px;border-radius:7px;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-size:12px;margin-left:7px;transition:transform .18s ease;}
  .store-summary-row.expanded .store-expand-icon{transform:rotate(180deg);}
  .store-detail-row td{padding:0!important;background:#fbfcfb;}
  .store-ticket-panel{padding:14px 16px 18px;border-bottom:1px solid var(--line);}
  .store-ticket-panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
  .store-ticket-panel-head b{font-size:12px;}.store-ticket-panel-head span{font-size:10px;color:var(--ink-soft);}
  .ticket-detail-list{display:flex;flex-direction:column;gap:8px;}
  .ticket-detail-item{display:grid;grid-template-columns:145px 105px 135px minmax(180px,1fr) 110px 110px;gap:10px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;}
  .ticket-detail-item>div{min-width:0;}
  .ticket-detail-label{display:block;font-size:8.5px;color:var(--ink-soft);margin-bottom:3px;}
  .ticket-detail-value{display:block;font-size:10.5px;font-weight:700;line-height:1.7;word-break:break-word;}
  .ticket-detail-number{font-size:11px;font-weight:900;color:var(--accent);direction:ltr;text-align:right;}
  .ticket-extra{grid-column:1 / -1;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;font-size:10px;color:var(--ink-soft);line-height:1.8;}
  .ticket-extra b{color:var(--ink);}
  .status-pill{display:inline-flex;padding:3px 8px;border-radius:99px;font-size:9.5px;font-weight:700;}
  @media(max-width:760px){
    .store-table{min-width:720px;}
    .ticket-detail-item{grid-template-columns:1fr 1fr;}
    .ticket-extra{grid-column:1 / -1;}
  }
  .status-good{background:var(--accent-soft);color:var(--accent);}.status-warn{background:var(--amber-soft);color:var(--amber);}.status-bad{background:var(--red-soft);color:var(--red);}
  .attention-list{display:flex;flex-direction:column;gap:8px;}
  .attention{border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;justify-content:space-between;gap:10px;align-items:center;}

  /* داشبورد مدیر ارشد تجهیز */
  .executive-wrap{max-width:1480px;padding-top:18px;}

  .exec-hero h2{margin:0 0 7px;font-size:25px;font-weight:800;letter-spacing:-.3px;}
  .exec-hero p{margin:0;color:rgba(255,255,255,.68);font-size:12px;line-height:2;max-width:650px;}
  .exec-hero-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .exec-live{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 11px;font-size:10.5px;color:rgba(255,255,255,.82);}

  .exec-refresh{border:1px solid rgba(255,255,255,.15);background:#fff;color:var(--exec-navy);border-radius:10px;padding:9px 13px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;}
  .exec-refresh:disabled{opacity:.55;cursor:not-allowed;}
  .exec-filterbar{display:grid;grid-template-columns:1.15fr repeat(5,1fr);gap:8px;background:#fff;border:1px solid #e6e9ef;border-radius:15px;padding:10px;margin-bottom:14px;box-shadow:0 6px 22px rgba(17,26,45,.045);}
  .exec-filterbar select,.exec-filterbar input{margin:0;background:#f8f9fb;border-color:#e8ebf0;min-width:0;font-size:11.5px;height:42px;}
  .exec-kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;margin-bottom:14px;}
  .exec-kpi{position:relative;overflow:hidden;background:#fff;border:1px solid #e6e9ef;border-radius:16px;padding:14px 14px 13px;min-height:122px;box-shadow:0 6px 22px rgba(17,26,45,.045);}
  .exec-kpi:after{content:'';position:absolute;width:68px;height:68px;border-radius:50%;left:-30px;bottom:-34px;background:var(--exec-soft,#eef2ff);}
  .exec-kpi-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .exec-kpi-label{font-size:10.5px;font-weight:700;color:#697286;}
  .exec-kpi-icon{width:31px;height:31px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--exec-soft,#eef2ff);color:var(--exec-tone,#3167f6);font-size:15px;}
  .exec-kpi-value{display:block;font-size:25px;line-height:1.1;font-weight:850;color:#141d30;margin-top:12px;letter-spacing:-.5px;}
  .exec-kpi-note{display:block;font-size:9.5px;color:#8a91a0;margin-top:7px;line-height:1.65;}

  .exec-kpi.health .exec-kpi-icon{background:rgba(255,255,255,.1);color:#8fb0ff;}
  .exec-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;margin-bottom:12px;}
  .exec-grid.equal{grid-template-columns:1fr 1fr;}
  .exec-grid.three{grid-template-columns:1.25fr .9fr .9fr;}
  .exec-card{background:#fff;border:1px solid #e6e9ef;border-radius:17px;padding:16px;box-shadow:0 6px 22px rgba(17,26,45,.045);min-width:0;}
  .exec-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:13px;}
  .exec-card-title{font-size:13.5px;font-weight:800;color:#162035;margin:0 0 3px;}
  .exec-card-sub{font-size:9.5px;color:#8a91a0;margin:0;line-height:1.7;}
  .exec-tag{font-size:9px;font-weight:800;border-radius:999px;padding:4px 8px;background:#eef2ff;color:#315bd6;white-space:nowrap;}
  .exec-health-panel{display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:center;min-height:260px;}
  .exec-gauge{position:relative;width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto;background:conic-gradient(var(--gauge-color,#168b67) calc(var(--gauge-value,0)*1%),#edf0f5 0);}
  .exec-gauge:after{content:'';position:absolute;inset:13px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 1px #edf0f5;}
  .exec-gauge-value{position:relative;z-index:1;text-align:center;}
  .exec-gauge-value b{display:block;font-size:38px;line-height:1;font-weight:900;color:#152037;}
  .exec-gauge-value span{display:block;font-size:9px;color:#8b93a3;margin-top:5px;}
  .exec-health-lines{display:flex;flex-direction:column;gap:10px;}
  .exec-health-line{display:grid;grid-template-columns:100px 1fr 40px;gap:9px;align-items:center;font-size:10.5px;color:#5e687b;}
  .exec-health-track{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden;}
  .exec-health-fill{height:100%;border-radius:99px;background:var(--fill,#3167f6);}
  .exec-health-num{text-align:left;font-weight:800;color:#27334b;}
  .exec-alert-list{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto;padding-left:2px;}
  .exec-alert{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:1px solid #e8ebf0;border-radius:12px;padding:10px 11px;background:#fbfcfd;}
  .exec-alert-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--alert-soft,#fff2dd);color:var(--alert-color,#c47716);font-size:14px;}
  .exec-alert b{display:block;font-size:10.8px;color:#253149;margin-bottom:2px;}
  .exec-alert span{display:block;font-size:9.2px;color:#8a91a0;line-height:1.65;}

  .exec-table{min-width:760px;font-size:10.5px;}
  .exec-table th{position:sticky;top:0;background:#f8f9fb;z-index:1;color:#7a8291;font-size:9px;padding:10px 8px;}
  .exec-table td{padding:10px 8px;color:#3e485a;}
  .exec-table tbody tr{cursor:pointer;transition:.12s;}
  .exec-table tbody tr:hover{background:#f7f9fc;}
  .exec-score{display:inline-flex;min-width:34px;justify-content:center;padding:4px 7px;border-radius:8px;font-size:10px;font-weight:900;background:#e8f5ef;color:#168b67;}
  .exec-score.warn{background:#fff1de;color:#c47716;}.exec-score.bad{background:#fde9e9;color:#c44141;}
  .exec-mini-status{display:inline-flex;padding:3px 7px;border-radius:999px;font-size:8.5px;font-weight:800;background:#edf0f5;color:#657084;}
  .exec-mini-status.red{background:#fde9e9;color:#c44141;}.exec-mini-status.amber{background:#fff1de;color:#c47716;}.exec-mini-status.green{background:#e8f5ef;color:#168b67;}
  .exec-rank-name b{display:block;font-size:10.8px;color:#253149;}.exec-rank-name span{display:block;font-size:8.8px;color:#9299a8;margin-top:2px;}
  .exec-progress{height:6px;background:#edf0f5;border-radius:99px;overflow:hidden;min-width:80px;}
  .exec-progress>i{display:block;height:100%;border-radius:99px;background:#3167f6;}
  .exec-ticket-panel{margin-top:12px;border:1px solid #dfe5ef;background:#f8faff;border-radius:15px;padding:14px;}
  .exec-ticket-panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
  .exec-ticket-panel-head b{font-size:12px;color:#1b2740;}.exec-ticket-panel-head span{font-size:9px;color:#8991a1;}
  .exec-ticket-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:420px;overflow:auto;}
  .exec-ticket{border:1px solid #e4e9f1;background:#fff;border-radius:12px;padding:11px;}
  .exec-ticket-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:7px;}
  .exec-ticket-number{direction:ltr;font-weight:900;font-size:9.5px;color:#315bd6;background:#eef2ff;border-radius:7px;padding:4px 7px;}
  .exec-ticket-store{font-size:10.5px;font-weight:800;color:#243149;}
  .exec-ticket-meta{font-size:8.7px;color:#8d95a4;margin-top:2px;}
  .exec-ticket-detail{font-size:9.5px;color:#596376;line-height:1.85;border-top:1px solid #edf0f4;padding-top:7px;margin-top:7px;}

  @media(max-width:1250px){.exec-kpis{grid-template-columns:repeat(4,1fr)}.exec-filterbar{grid-template-columns:repeat(3,1fr)}.exec-grid.three{grid-template-columns:1fr 1fr}.exec-grid.three>.exec-card:first-child{grid-column:1/-1}}
  @media(max-width:850px){.exec-grid,.exec-grid.equal,.exec-grid.three{grid-template-columns:1fr}.exec-grid.three>.exec-card:first-child{grid-column:auto}.exec-health-panel{grid-template-columns:1fr}.exec-ticket-grid{grid-template-columns:1fr}.exec-filterbar{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.executive-wrap{padding:12px 10px 45px}.exec-hero{padding:19px 17px;border-radius:17px}.exec-hero h2{font-size:20px}.exec-kpis{grid-template-columns:repeat(2,1fr)}.exec-filterbar{grid-template-columns:1fr}.exec-kpi{min-height:112px}.exec-gauge{width:135px;height:135px}.exec-health-line{grid-template-columns:84px 1fr 34px}}


  /* =========================================================
     دسترسی مدیر ارشد تجهیز — Decision Intelligence v6.0
     زبان بصری کاملاً مستقل از پنل عملیاتی
     ========================================================= */
  .executive-page{
    min-height:100vh;
    background:
      radial-gradient(circle at 8% 2%,rgba(103,226,215,.11),transparent 28%),
      radial-gradient(circle at 96% 22%,rgba(215,255,99,.08),transparent 25%),
      #0a0d10;
    color:#f4f3ed;
    font-family:'Vazirmatn',sans-serif;
  }
  .x-shell{
    --x-bg:#0a0d10;
    --x-panel:#11161b;
    --x-panel-2:#151b21;
    --x-line:#273039;
    --x-text:#f4f3ed;
    --x-muted:#929ba5;
    --x-acid:#d7ff63;
    --x-aqua:#67e2d7;
    --x-coral:#ff7b6b;
    --x-blue:#86a8ff;
    --x-paper:#f0eee6;
    min-height:100vh;
    display:grid;
    grid-template-columns:286px minmax(0,1fr);
    direction:rtl;
  }
  .x-side{
    position:sticky;
    top:0;
    height:100vh;
    padding:24px 20px;
    background:rgba(8,11,14,.91);
    backdrop-filter:blur(18px);
    border-left:1px solid var(--x-line);
    display:flex;
    flex-direction:column;
    gap:20px;
    z-index:5;
  }
  .x-side-brand{display:flex;align-items:center;gap:11px;padding-bottom:17px;border-bottom:1px solid var(--x-line);}
  .x-mark{width:38px;height:38px;border-radius:12px;background:var(--x-acid);color:#0a0d10;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:16px;box-shadow:0 0 30px rgba(215,255,99,.16);}
  .x-side-brand b{display:block;font-size:13px;letter-spacing:-.15px;}.x-side-brand span{display:block;color:var(--x-muted);font-size:9px;margin-top:3px;}
  .x-side-label{font-size:8.5px;letter-spacing:1.6px;color:#5e6871;font-weight:800;text-transform:uppercase;margin-bottom:8px;}
  .x-filters{display:flex;flex-direction:column;gap:8px;}
  .x-filter{position:relative;}
  .x-filter label{color:#707a84;font-size:8.5px;margin:0 0 5px;font-weight:700;}
  .x-filter select{
    margin:0;height:41px;border-radius:10px;border:1px solid #222a32;background:#0f1419;color:#e9e8e2;font-size:10.5px;padding:8px 10px;
  }
  .x-filter select:focus{border-color:#52606c;background:#111820;}
  .x-nav{display:flex;flex-direction:column;gap:4px;}
  .x-nav button{border:0;background:transparent;color:#7d8791;text-align:right;font-family:inherit;font-size:10px;padding:8px 9px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .x-nav button:hover{background:#11171c;color:#fff;}.x-nav button span{color:#47515b;font-size:8px;}
  .x-side-bottom{margin-top:auto;border-top:1px solid var(--x-line);padding-top:15px;}
  .x-live{display:flex;align-items:center;gap:8px;color:#a8b0b8;font-size:9.5px;line-height:1.8;}
  .x-live-dot{width:7px;height:7px;border-radius:50%;background:var(--x-aqua);box-shadow:0 0 0 5px rgba(103,226,215,.08);flex-shrink:0;}
  .x-user{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid #1e252c;}
  .x-user b{display:block;font-size:10px;}.x-user span{display:block;font-size:8.5px;color:#68727c;margin-top:2px;}
  .x-logout{border:1px solid #2c343c;background:transparent;color:#aeb5bc;border-radius:8px;padding:6px 9px;font-family:inherit;font-size:8.5px;font-weight:700;cursor:pointer;}
  .x-main{min-width:0;padding:24px 26px 58px;}
  .x-topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;}
  .x-breadcrumb{font-size:9px;color:#69737d;letter-spacing:.2px;}.x-breadcrumb b{color:#d9ddd9;}
  .x-refresh{border:1px solid #313a43;background:#11171c;color:#d8ddd9;border-radius:9px;padding:8px 11px;font-family:inherit;font-size:9.5px;font-weight:800;cursor:pointer;}
  .x-refresh:disabled{opacity:.45;cursor:not-allowed;}
  .x-hero{
    position:relative;overflow:hidden;background:var(--x-paper);color:#101419;border-radius:4px 30px 4px 30px;padding:28px 30px 26px;margin-bottom:18px;
    display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,.75fr);gap:28px;box-shadow:0 28px 70px rgba(0,0,0,.27);
  }
  .x-hero:after{content:'';position:absolute;width:280px;height:280px;border:1px solid rgba(16,20,25,.11);border-radius:50%;left:-95px;top:-155px;box-shadow:0 0 0 38px rgba(16,20,25,.025),0 0 0 76px rgba(16,20,25,.018);}
  .x-hero-copy{position:relative;z-index:1;}
  .x-kicker{font-size:9px;font-weight:900;letter-spacing:1.8px;color:#66706f;margin-bottom:9px;}
  .x-hero h1{margin:0 0 12px;font-size:31px;line-height:1.35;letter-spacing:-1px;font-weight:950;max-width:760px;}
  .x-summary{font-size:12px;line-height:2.15;color:#3e474b;margin:0;max-width:850px;}
  .x-period{position:relative;z-index:1;border-right:1px solid rgba(16,20,25,.14);padding-right:22px;display:flex;flex-direction:column;justify-content:space-between;}
  .x-period-label{font-size:8.5px;color:#737c7d;font-weight:800;letter-spacing:1px;}.x-period-value{font-size:34px;line-height:1.15;font-weight:950;letter-spacing:-1px;margin-top:8px;}.x-period-sub{font-size:9px;color:#697174;line-height:1.8;margin-top:8px;}
  .x-hero-stamp{display:inline-flex;align-self:flex-start;margin-top:20px;background:#101419;color:#f1f0e9;border-radius:999px;padding:7px 10px;font-size:8.5px;font-weight:800;gap:6px;align-items:center;}
  .x-hero-stamp i{width:6px;height:6px;border-radius:50%;background:var(--x-acid);display:block;}
  .x-section{scroll-margin-top:18px;margin-top:24px;}
  .x-section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:12px;border-bottom:1px solid var(--x-line);padding-bottom:10px;}
  .x-section-title{display:flex;align-items:flex-start;gap:12px;}.x-section-no{font-size:9px;color:var(--x-acid);font-weight:900;letter-spacing:1px;margin-top:3px;}.x-section-title h2{font-size:15px;margin:0 0 3px;font-weight:900;letter-spacing:-.2px;}.x-section-title p{font-size:9px;color:var(--x-muted);margin:0;line-height:1.8;}
  .x-section-meta{font-size:8.5px;color:#66717b;}
  .x-metrics{display:grid;grid-template-columns:1.15fr repeat(4,1fr);gap:1px;background:var(--x-line);border:1px solid var(--x-line);}
  .x-metric{min-height:143px;background:#0e1317;padding:16px 16px 15px;position:relative;overflow:hidden;}
  .x-metric.primary{background:linear-gradient(145deg,#d7ff63,#bde946);color:#101419;}

// fallback: اگر فایل خارج از محیط آرتیفکت Claude باز شود، window.storage در دسترس نیست.
// در آن حالت داده‌ها فقط روی همان مرورگر ذخیره می‌شوند (بدون اشتراک بین افراد).
if (!window.storage) {
  window.storage = {
    async get(key, shared){
      const raw = localStorage.getItem((shared?'shared:':'local:')+key);
      if (raw === null) throw new Error('key not found');
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem((shared?'shared:':'local:')+key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      localStorage.removeItem((shared?'shared:':'local:')+key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      const p = (shared?'shared:':'local:')+(prefix||'');
      const keys = Object.keys(localStorage).filter(k => k.startsWith(p)).map(k => k.slice((shared?'shared:':'local:').length));
      return { keys, prefix, shared: !!shared };
    }
  };
}

const { useState, useEffect, useRef, useCallback } = React;

const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxbMta1nOpWgXT_ZB_9UjP6syt4gjLS7AUqhAtZ-mBj5l014WXrHv3iB8cLJpoFVYLC/exec';

function jsonpRequest(params, timeoutMs=20000){
  return new Promise((resolve, reject) => {
    const callbackName = '__ticketing_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let finished = false;
    const cleanup = () => {
      if(script.parentNode) script.parentNode.removeChild(script);
      try{ delete window[callbackName]; }catch(e){ window[callbackName] = undefined; }
    };
    const timer = setTimeout(() => {
      if(finished) return; finished = true; cleanup(); reject(new Error('timeout'));
    }, timeoutMs);
    window[callbackName] = result => {
      if(finished) return; finished = true; clearTimeout(timer); cleanup(); resolve(result || {success:false});
    };
    script.onerror = () => {
      if(finished) return; finished = true; clearTimeout(timer); cleanup(); reject(new Error('network'));
    };
    const query = new URLSearchParams({...params, callback:callbackName, _:String(Date.now())});
    script.src = SHEET_URL + '?' + query.toString();
    document.body.appendChild(script);
  });
}

function normalizeLoginDigits(value){
  return String(value||'')
    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[\u200c\u200f\u202a-\u202e\s]/g,'')
    .trim();
}
function loginWithSheet(username, password){
  return jsonpRequest({
    action:'login',
    username:normalizeLoginDigits(username),
    password:normalizeLoginDigits(password),
    attempt:String(Date.now())
  },15000);
}

function fetchManagerTickets(token){
  return jsonpRequest({action:'tickets', token:String(token||'')}, 30000);
}

}
function fetchTechnicianTickets(token){
  return jsonpRequest({action:'mytickets', token:String(token||'')}, 30000);
}

function lookupStoreWithSheet(code, token){

    method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},

      action:'completeOutsource', token:String(token||''), rowNumber:ticket.rowNumber,
      completionNote:completion.completionNote||'', completionParts:completion.completionParts||[], finalCause:completion.finalCause||'', finalCauseDetails:completion.finalCauseDetails||''

}

      consumedParts:ticket.consumedParts||[], hotParts:ticket.hotParts||[], outsourceReason:ticket.outsourceReason||'',

}

async function sendToSheet(t){
  const now = new Date(t.createdAt || Date.now());
  await fetch(SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({
      action: 'createTicket',
      date: now.toLocaleDateString('fa-IR'),
      time: now.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'}),
      storeCode: t.storeCode || '',
      technician: t.technician || '',
      type: t.type || '',
      level1: t.level1 || '',
      level2: t.level2 || [],
      otherText: t.otherText || '',
      consumedParts: t.consumedParts || [],
      hotParts: t.hotParts || [],
      outsourceReason: t.outsourceReason || '',
      initialCause: t.initialCause || '',
      initialCauseDetails: t.initialCauseDetails || '',
      finalCause: t.finalCause || '',
      finalCauseDetails: t.finalCauseDetails || '',
      reviewStatus: t.reviewStatus || '',
      managerNote: t.managerNote || '',
      id: t.id || '',
      createdAt: t.createdAt || '',
      technicianCode: t.technicianCode || '',
      storeName: t.storeName || '',
      region: t.region || '',
      workStatus: t.workStatus || '',
      completedAt: t.completedAt || '',
      ticketNumber: t.ticketNumber || '',
      token: t.token || ''
    })
  });
}

function waitMs(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function confirmTicketSaved(ticket, token){
  const delays=[600,900,1300,1800,2600,3600];
  for(const delay of delays){
    await waitMs(delay);
    const result=await fetchTechnicianTickets(token);
    if(result&&result.sessionExpired){
      throw new Error(result.message||'نشست کاربر منقضی شده؛ دوباره وارد شوید');
    }
    if(result&&result.success){
      const found=(result.tickets||[]).find(x=>
        String(x.id||'')===String(ticket.id||'') ||
        (ticket.ticketNumber&&String(x.ticketNumber||'')===String(ticket.ticketNumber))
      );
      if(found)return found;
    }
  }
  return null;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function makeTicketNumber(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  const date=String(d.getFullYear()).slice(-2)+p(d.getMonth()+1)+p(d.getDate());
  const time=p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
  const random=String(Math.floor(10+Math.random()*90));
  return 'DM-'+date+'-'+time+'-'+random;

function normalizeQtyInput(value){
  return String(value ?? '')
    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[^0-9]/g,'');
}
function finalQty(value){
  const n=parseInt(normalizeQtyInput(value),10);
  return Number.isFinite(n)&&n>0?n:1;
}
function hasInvalidPartQty(parts){
  return (parts||[]).some(p=>String(p.name||'').trim() && !/^[1-9][0-9]*$/.test(normalizeQtyInput(p.qty)));

function normalizePartsQty(parts){
  return (parts||[]).map(p=>({...p,qty:finalQty(p.qty)}));
}

function emptyDraft(){
  return {type:'',level1:'',level2:[],otherText:'',outsourceReason:'',initialCause:'',initialCauseDetails:'',consumedParts:[],hotParts:[]};
}

function validDraft(d){
  if(!d.level1)return false;
  if(d.level1==='سایر موارد'&&!String(d.otherText||'').trim())return false;
  const cat=CATEGORIES.find(c=>c.l1===d.level1);
  if(cat&&cat.l2.length>0&&(!d.level2||d.level2.length===0))return false;
  if(!d.type)return false;
  if(!String(d.initialCause||'').trim())return false;
  if(d.initialCause==='سایر'&&!String(d.initialCauseDetails||'').trim())return false;
  if(d.type==='outsourced'&&!d.outsourceReason)return false;
  if(hasInvalidPartQty(d.consumedParts)||hasInvalidPartQty(d.hotParts))return false;
  return true;
}

function ticketSummary(t){
  const l2=t.level2&&t.level2.length?' («'+t.level2.join('، ')+'»)':'';
  const other=t.level1==='سایر موارد'&&t.otherText?': '+t.otherText:'';

  if(t.type==='outsourced'&&t.outsourceReason)chunks.push('علت برون‌سپاری: '+t.outsourceReason);
  if(t.consumedParts&&t.consumedParts.filter(p=>p.name).length)chunks.push('قطعات مصرفی: '+t.consumedParts.filter(p=>p.name).map(p=>p.name+' ×'+p.qty).join('، '));

  return chunks.join(' — ');
}

function normalizeFaDigits(v){
  return String(v||'')
    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}
function normalizeTicketDateLabel(value){
  const clean=normalizeFaDigits(value)
    .replace(/[\u200c\u200e\u200f\u202a-\u202e]/g,'')
    .replace(/[.\-]/g,'/')
    .replace(/\s+/g,'')
    .replace(/\/+/g,'/')
    .trim();
  const parts=clean.match(/\d+/g);
  if(!parts||parts.length<3)return clean;
  return [Number(parts[0]),Number(parts[1]),Number(parts[2])].join('/');
}
function ticketDate(t){
  return normalizeTicketDateLabel(t.dateText || (t.createdAt?dateKey(t.createdAt):''));
}
function ticketDateSortValue(value){
  const parts=normalizeTicketDateLabel(value).match(/\d+/g);
  if(!parts||parts.length<3)return Number.MAX_SAFE_INTEGER;
  const year=Number(parts[0])||0;
  const month=Number(parts[1])||0;
  const day=Number(parts[2])||0;
  return year*10000+month*100+day;
}
function compareTicketDateLabels(a,b){
  const diff=ticketDateSortValue(a)-ticketDateSortValue(b);
  if(Number.isFinite(diff)&&diff!==0)return diff;
  return String(a||'').localeCompare(String(b||''),'fa',{numeric:true});
}
function reviewLabel(v){return v==='reviewed'?'بررسی‌شده':v==='rejected'?'ردشده':v==='cancelled'?'لغوشده':'در انتظار';}
function pct(n,d){return d?Math.round(n/d*100):0;}
function countBy(list,keyFn){const out={};list.forEach(x=>{const k=keyFn(x);if(k)out[k]=(out[k]||0)+1;});return out;}
function sortedEntries(obj,limit){return Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,limit||999);}

  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const usernameRef = useRef(null);
  const passwordRef = useRef(null);
  const requestSeq = useRef(0);

  useEffect(()=>{
    // هیچ تلاش ناموفقی در مرورگر ذخیره یا قفل نمی‌شود.
    // ورود قبلیِ ناقص نیز پاک می‌شود تا کاربران فعلی بتوانند دوباره تلاش کنند.
    try{ sessionStorage.removeItem('ticketing-user'); }catch(e){}
  },[]);

  const clearError = () => {
    if(error) setError('');
  };

  const resetLoginForm = () => {
    requestSeq.current += 1; // پاسخ هر درخواست قبلی دیگر اثری ندارد
    setLoading(false);
    setError('');
    setUsername('');
    setPassword('');
    try{ sessionStorage.removeItem('ticketing-user'); }catch(e){}
    setTimeout(()=>usernameRef.current && usernameRef.current.focus(),30);
  };

  const submit = async (event) => {
    if(event && event.preventDefault) event.preventDefault();
    if(loading) return;

    // مقدار واقعی داخل کادر خوانده می‌شود تا Autofill موبایل مقدار قدیمی نفرستد.
    const rawUsername = usernameRef.current ? usernameRef.current.value : username;
    const rawPassword = passwordRef.current ? passwordRef.current.value : password;
    const cleanUsername = normalizeLoginDigits(rawUsername);
    const cleanPassword = normalizeLoginDigits(rawPassword);

    setUsername(cleanUsername);
    setPassword(cleanPassword);

    if(!cleanUsername || !cleanPassword){
      setError('کد پرسنلی و رمز عبور را وارد کنید');
      if(!cleanUsername){
        setTimeout(()=>usernameRef.current && usernameRef.current.focus(),30);
      }else{
        setTimeout(()=>passwordRef.current && passwordRef.current.focus(),30);
      }
      return;
    }

    const myRequest = ++requestSeq.current;
    setLoading(true);
    setError('');

    try{
      const result = await loginWithSheet(cleanUsername, cleanPassword);
      if(myRequest !== requestSeq.current) return;

      if(result && result.success){
        // هیچ خطای قبلی یا نشست ناقصی به ورود درست منتقل نمی‌شود.
        try{ sessionStorage.removeItem('ticketing-user'); }catch(e){}
        onLogin({
          username: String(result.username || cleanUsername).trim(),
          name: String(result.name || '').trim(),
          role: result.role === 'admin' ? 'admin' : (result.role === 'manager' ? 'manager' : 'technician'),
          token: String(result.token || '')
        });
        return;
      }

      setError((result && result.message) || 'نام کاربری یا رمز عبور اشتباه است');
      // بعد از اشتباه، رمز پاک می‌شود و کاربر فوراً می‌تواند دوباره وارد کند.
      setPassword('');
      if(passwordRef.current) passwordRef.current.value='';
      setTimeout(()=>passwordRef.current && passwordRef.current.focus(),30);
    }catch(e){
      if(myRequest !== requestSeq.current) return;
      setError('ارتباط با سرور برقرار نشد؛ دوباره تلاش کنید');
      setTimeout(()=>passwordRef.current && passwordRef.current.focus(),30);
    }finally{
      if(myRequest === requestSeq.current) setLoading(false);
    }
  };

  return React.createElement('div',{className:'wrap'},
    React.createElement('div',{className:'login-wrap'},
      React.createElement('form',{className:'login-card',onSubmit:submit,noValidate:true,autoComplete:'off'},
        React.createElement('div',{className:'login-head'},
          React.createElement('div',{className:'login-icon'},'🧰'),
          React.createElement('h2',null,'ورود به پشتیبانی فنی'),
          React.createElement('p',null,'با کد پرسنلی و رمز اختصاصی خود وارد شوید')
        ),
        error && React.createElement('div',{className:'login-error',role:'alert'},error),
        React.createElement('label',{htmlFor:'ticketing-personnel-code'},'کد پرسنلی'),
        React.createElement('input',{
          id:'ticketing-personnel-code',
          ref:usernameRef,
          name:'ticketing_personnel_code_v36',
          type:'text',
          value:username,
          onChange:e=>{setUsername(e.target.value);clearError();},
          inputMode:'text',
          autoComplete:'off',
          autoCapitalize:'none',
          spellCheck:false,
          'data-lpignore':'true',
          'data-1p-ignore':'true',
          placeholder:'کد پرسنلی'
        }),
        React.createElement('label',{htmlFor:'ticketing-password'},'رمز عبور'),
        React.createElement('input',{
          id:'ticketing-password',
          ref:passwordRef,
          name:'ticketing_password_v36',
          type:'password',
          value:password,
          onChange:e=>{setPassword(e.target.value);clearError();},
          inputMode:'numeric',
          pattern:'[0-9۰-۹٠-٩]*',
          autoComplete:'new-password',
          autoCapitalize:'none',
          spellCheck:false,
          'data-lpignore':'true',
          'data-1p-ignore':'true',
          placeholder:'رمز ۶ رقمی'
        }),
        React.createElement('div',{className:'login-actions'},
          React.createElement('button',{
            type:'submit',
            className:'btn btn-primary',
            disabled:loading
          },loading?'در حال بررسی...':'ورود'),
          React.createElement('button',{
            type:'button',
            className:'login-reset',
            onClick:resetLoginForm
          },'پاک کردن فرم و تلاش دوباره')
        ),
        React.createElement('div',{className:'login-note'},'تعداد ورود اشتباه باعث قفل شدن حساب نمی‌شود؛ هر زمان اطلاعات درست وارد شود، ورود انجام خواهد شد.')
      )
    )
  );
}

/* ---------- اپ اصلی ---------- */
function App(){
  const [currentUser,setCurrentUser]=useState(()=>{try{const raw=sessionStorage.getItem('ticketing-user');return raw?JSON.parse(raw):null;}catch(e){return null;}});
  const [tasks,setTasks]=useState([]);
  const [loaded,setLoaded]=useState(false);
  const [managerLoading,setManagerLoading]=useState(false);
  const [lastUpdated,setLastUpdated]=useState('');
  const [toastMsg,setToastMsg]=useState('');
  const toastTimer=useRef(null);
  const lastSyncError=useRef('');
  const role=currentUser?(currentUser.role==='admin'?'admin':(currentUser.role==='manager'?'manager':'tech')):null;
  const showToast=m=>{setToastMsg(m);clearTimeout(toastTimer.current);toastTimer.current=setTimeout(()=>setToastMsg(''),2600);};

  const handleLogin=user=>{sessionStorage.setItem('ticketing-user',JSON.stringify(user));setCurrentUser(user);setLoaded(false);};
  const logout=()=>{sessionStorage.removeItem('ticketing-user');setCurrentUser(null);setTasks([]);setLoaded(false);};

  const loadTasks=useCallback(async()=>{
    if(!currentUser)return;

    const showSyncErrorOnce=(message)=>{
      const msg=String(message||'').trim();
      if(!msg||lastSyncError.current===msg)return;
      lastSyncError.current=msg;
      showToast(msg);
    };

    if(currentUser.role==='manager'||currentUser.role==='admin'){
      if(!currentUser.token){logout();return;}
      setManagerLoading(true);
      try{
        const fetchForRole=()=>currentUser.role==='admin'
          ? fetchExecutiveTickets(currentUser.token)
          : fetchManagerTickets(currentUser.token);

        let result=await fetchForRole();

        // گاهی بلافاصله بعد از ورود، درخواست داشبورد زودتر از تثبیت نشست می‌رسد.
        // یک بار بدون خروج کاربر دوباره بررسی می‌کنیم.
        if(result&&result.sessionExpired){
          await new Promise(resolve=>setTimeout(resolve,900));
          result=await fetchForRole();
        }

        if(result&&result.success){
          lastSyncError.current='';
          setTasks(result.tickets||[]);
          setLastUpdated(result.updatedAt||new Date().toISOString());
          setLoaded(true);
        }else if(result&&result.sessionExpired){
          showToast(result.message||'نشست معتبر نیست؛ دوباره وارد شوید');
          setTimeout(logout,900);
        }else{
          // خطاهای silent مربوط به درخواست‌های پس‌زمینه به کاربر نمایش داده نمی‌شوند.
          if(!(result&&result.silent)){
            showSyncErrorOnce((result&&result.message)||'دریافت داده‌ها انجام نشد');
          }
          setLoaded(true);
        }
      }catch(e){
        showSyncErrorOnce('ارتباط با داده‌های مدیریتی برقرار نشد');
        setLoaded(true);
      }finally{
        setManagerLoading(false);
      }
    }else{
      if(!currentUser.token){logout();return;}
      try{
        const result=await fetchTechnicianTickets(currentUser.token);
        if(result&&result.success){
          lastSyncError.current='';
          setTasks(result.tickets||[]);
          setLastUpdated(result.updatedAt||new Date().toISOString());
          setLoaded(true);
        }else if(result&&result.sessionExpired){
          showToast(result.message||'دوباره وارد شوید');
          logout();
        }else{
          if(!(result&&result.silent)){
            showSyncErrorOnce((result&&result.message)||'دریافت کارهای شما انجام نشد');
          }
          setLoaded(true);
        }
      }catch(e){
        try{
          const res=await window.storage.get('tasks',true);
          setTasks(res?JSON.parse(res.value):[]);
        }catch(_){
          setTasks([]);
        }
        showSyncErrorOnce('ارتباط با سرور برقرار نشد؛ اطلاعات محلی نمایش داده شد');
        setLoaded(true);
      }
    }
  },[currentUser]);

  useEffect(()=>{if(!currentUser)return;loadTasks();const iv=setInterval(loadTasks,(currentUser.role==='manager'||currentUser.role==='admin')?30000:15000);return()=>clearInterval(iv);},[currentUser,loadTasks]);

  const saveTasks=async updater=>{const next=updater(tasks);try{await window.storage.set('tasks',JSON.stringify(next),true);}catch(e){}setTasks(next);return next;};

  const updateManagerTask=async(id,patch)=>{
    const original=tasks.find(t=>t.id===id);if(!original)return;
    const updated={...original,...patch,managerNote:patch.managerNote!==undefined?(patch.managerNote||original.managerNote):original.managerNote};
    setTasks(list=>list.map(t=>t.id===id?updated:t));
    try{await sendManagerUpdate(updated,currentUser.token);setTimeout(loadTasks,900);}catch(e){showToast('ارسال تغییرات انجام نشد');}
  };

  if(!currentUser)return React.createElement(LoginView,{onLogin:handleLogin});

  if(role==='admin'){
    return React.createElement('div',{className:'executive-page'},
      !loaded?React.createElement('div',{className:'x-empty',style:{paddingTop:'25vh'}},'در حال بارگذاری گزارش مدیریت ارشد...'):React.createElement(ExecutiveDashboard,{tasks,onRefresh:loadTasks,loading:managerLoading,lastUpdated,currentUser,onLogout:logout}),
      React.createElement(Toast,{msg:toastMsg})
    );
  }

  return React.createElement('div',{className:'wrap'},
    React.createElement('div',{className:'top'},
      React.createElement('div',{className:'brand'},React.createElement('span',{className:'dot'}),React.createElement('div',null,React.createElement('h1',null,'پشتیبانی فنی فروشگاه‌ها'),React.createElement('span',null,(role==='tech'?'محیط نیروی فنی':'مرکز کنترل مدیریت فنی')+' • نسخه 7.0'))),
      React.createElement('div',{className:'user-bar'},React.createElement('div',{className:'user-info'},React.createElement('b',null,currentUser.name),React.createElement('span',null,role==='manager'?'مدیر فنی':'کد پرسنلی: '+currentUser.username)),React.createElement('button',{className:'logout-btn',onClick:logout},'خروج'))
    ),
    !loaded?React.createElement('div',{className:'empty'},'در حال بارگذاری اطلاعات...'):(role==='tech'?React.createElement(TechView,{tasks,saveTasks,showToast,currentUser,refreshTasks:loadTasks}):React.createElement(ManagerView,{tasks,updateTask:updateManagerTask,showToast,refreshTasks:loadTasks,managerLoading,lastUpdated})),
    React.createElement(Toast,{msg:toastMsg})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
